<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Trail — A Reading Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E2E9EF; --sheet:#F7FAFC; --ink:#172638; --muted:#566578; --line:#C2CDD7;
  --berry:#31508A; --berry-soft:#DFE6F3; --ochre:#B07A1C; --ochre-soft:#F5E9CF;
  --pine:#2D5A48; --pine-soft:#DAE8E1; --sea:#2B6F7E; --sea-soft:#D8EAEE;
  --miss:#A8323E; --miss-soft:#F5DEE1; --snow:#FFFFFF;
  --shadow:0 1px 0 rgba(23,38,56,.08), 0 10px 30px -18px rgba(23,38,56,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1722; --sheet:#182333; --ink:#E6ECF3; --muted:#9AA8BA; --line:#2C3A4F;
    --berry:#8FAAE3; --berry-soft:#1F2B45; --ochre:#E2B65C; --ochre-soft:#3A3020;
    --pine:#82B9A6; --pine-soft:#1C3330; --sea:#7DC0CC; --sea-soft:#183139;
    --miss:#E46A7E; --miss-soft:#3A1E27; --snow:#C9D6E6;
    --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1722; --sheet:#182333; --ink:#E6ECF3; --muted:#9AA8BA; --line:#2C3A4F;
  --berry:#8FAAE3; --berry-soft:#1F2B45; --ochre:#E2B65C; --ochre-soft:#3A3020;
  --pine:#82B9A6; --pine-soft:#1C3330; --sea:#7DC0CC; --sea-soft:#183139;
  --miss:#E46A7E; --miss-soft:#3A1E27; --snow:#C9D6E6;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Alegreya Sans",system-ui,"Segoe UI",sans-serif;font-size:clamp(15px,1.15vw + 6px,18px);line-height:1.45;overflow:hidden}
.serif{font-family:"IM Fell English",Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* HUD */
.hud{position:relative;display:flex;align-items:center;gap:1rem;padding:.55rem 1.1rem;background:var(--ink);color:var(--paper)}
.brand{display:flex;align-items:baseline;gap:.6rem;min-width:0}
.brand h1{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:1.35rem;margin:0;white-space:nowrap}
.brand span{font-size:.85rem;opacity:.75;white-space:nowrap}
.hud .strip{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;min-width:60px}
.hud .strip i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ochre),#E5C06E);border-radius:4px;transition:width 1.2s cubic-bezier(.3,.7,.2,1)}
.stats{display:flex;gap:.9rem;align-items:center}
.stat{display:flex;align-items:center;gap:.3rem;font-weight:700;font-size:.95rem;white-space:nowrap}
.stat svg{width:18px;height:18px}
.stat small{font-weight:500;opacity:.7;font-size:.78rem}
.hud-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:inherit;border-radius:999px;padding:.25rem .7rem;font-size:.82rem}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hud{background:#0A1019;color:var(--ink)} }
:root[data-theme="dark"] .hud{background:#0A1019;color:var(--ink)}

/* Stage */
.stage{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:1rem;padding:1rem 1.1rem;min-height:0}
.panel{background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--line)}
.crumb{font-size:.85rem;color:var(--muted)}
.crumb b{color:var(--ink)}
.panel-body{flex:1;overflow:auto;padding:1.1rem 1.4rem;min-height:0}
.panel-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1.25rem;border-top:1px solid var(--line);background:color-mix(in srgb,var(--sheet) 85%,var(--paper))}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ochre)}
.dots i.now{background:var(--berry);transform:scale(1.25)}

.side{display:grid;grid-template-rows:auto 1fr;gap:1rem;min-height:0}
.card{background:var(--sheet);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);padding:.8rem 1rem}
.card h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:1.15rem;margin:0 0 .3rem}
.card .sub{font-size:.8rem;color:var(--muted);margin:0 0 .4rem}
#map svg{width:100%;height:auto;display:block}
.trunk-card{display:flex;flex-direction:column;min-height:0}
.trunk-wrap{display:flex;gap:.8rem;align-items:center}
.trunk-wrap svg.trunk{width:92px;flex:none}
.slots{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-top:.6rem}
.slot{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;position:relative}
.slot.got{border:none;background:radial-gradient(circle at 35% 30%,#F2D58E,var(--ochre) 70%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.slot svg{width:62%;height:62%;stroke:#3A2A08;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slot.new{animation:drop .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(-40px) scale(1.6);opacity:0}100%{transform:none;opacity:1}}
.stamps{display:flex;gap:6px;margin-top:.7rem}
.stamp{flex:1;border:1.5px dashed var(--line);border-radius:999px;padding:.25rem .2rem;text-align:center;font-size:.7rem;color:var(--muted);line-height:1.15}
.stamp.got{border:2px solid var(--berry);color:var(--berry);font-weight:700;background:var(--berry-soft)}

/* Content */
h2.title{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(1.5rem,2.2vw + .6rem,2.2rem);line-height:1.1;margin:.1rem 0 .5rem}
.lede{color:var(--muted);max-width:60ch;margin:0 0 1rem}
.kind{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:700;color:var(--pine);background:var(--pine-soft);padding:.15rem .6rem;border-radius:999px}
.kind.sea{color:var(--sea);background:var(--sea-soft)}
.kind.berry{color:var(--berry);background:var(--berry-soft)}
.kind.ochre{color:var(--ochre);background:var(--ochre-soft)}
.btn{background:var(--berry);color:var(--sheet);border:none;border-radius:10px;padding:.6rem 1.2rem;font-weight:800;font-size:1rem;box-shadow:0 3px 0 color-mix(in srgb,var(--berry) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--berry) 60%,#000)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.read-aloud{display:inline-flex;align-items:center;gap:.35rem;background:var(--sea-soft);color:var(--sea);border:none;border-radius:999px;padding:.25rem .7rem;font-size:.85rem;font-weight:700}
.read-aloud svg{width:16px;height:16px}

.prose{max-width:62ch;font-size:1.06em;line-height:1.6}
.prose p{margin:0 0 .8rem}
.q{font-size:1.15em;font-weight:700;max-width:60ch;margin:.3rem 0 .9rem}
.choices{display:grid;gap:.55rem;max-width:62ch}
.choice{display:flex;gap:.75rem;align-items:center;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.choice:hover:not([disabled]){border-color:var(--sea);background:var(--sea-soft)}
.choice .ltr{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-weight:800;font-size:.85rem}
.choice.right{border-color:var(--pine);background:var(--pine-soft)}
.choice.right .ltr{background:var(--pine);color:var(--sheet)}
.choice.wrong{border-color:var(--miss);background:var(--miss-soft)}
.choice.wrong .ltr{background:var(--miss);color:#fff}
.choice[disabled]{cursor:default}
.why{margin-top:.9rem;max-width:62ch;padding:.7rem .9rem;border-left:4px solid var(--pine);background:var(--pine-soft);border-radius:0 8px 8px 0}
.why.miss{border-color:var(--miss);background:var(--miss-soft)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}
.word{border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;background:var(--sheet)}
.word b{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:1.35rem;color:var(--sea);display:block}
.word p{margin:.2rem 0 0;font-size:.93rem}
.word em{color:var(--muted);font-size:.88rem}
textarea{width:100%;max-width:62ch;min-height:7.5rem;border:1.5px solid var(--line);border-radius:10px;padding:.7rem;font:inherit;background:var(--paper);color:var(--ink);resize:vertical}
.count{font-size:.85rem;color:var(--muted);margin-top:.3rem}
.gate{display:flex;gap:1.2rem;align-items:center;max-width:62ch}
.gate svg{width:110px;flex:none}
.journey-list{display:grid;gap:.45rem;max-width:62ch;margin:1rem 0}
.jl{display:flex;align-items:center;gap:.7rem;padding:.5rem .75rem;border-radius:10px;border:1px solid var(--line)}
.jl.done{opacity:.6}
.jl.now{border:2px solid var(--berry);background:var(--berry-soft)}
.jl .n{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-weight:800;font-size:.8rem;flex:none}
.jl.done .n{background:var(--pine);color:var(--sheet)}
.jl .st{margin-left:auto;font-size:.85rem;color:var(--ochre);font-weight:700;white-space:nowrap}
.medal{width:140px;height:140px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#F6DE9E,var(--ochre) 72%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 12px 30px -10px rgba(176,127,34,.7);animation:medal 1.1s cubic-bezier(.3,1.5,.5,1)}
.medal svg{width:58%;height:58%;stroke:#3A2A08;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes medal{0%{transform:scale(.2) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
.center{text-align:center}
.bigstars{display:flex;justify-content:center;gap:.4rem;margin:.6rem 0}
.bigstars svg{width:40px;height:40px}
.bigstars svg.off path{fill:var(--line)}
.bigstars svg.on{animation:pop .5s backwards}
.bigstars svg.on:nth-child(2){animation-delay:.25s}.bigstars svg.on:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:none}}
.namefield{font:inherit;font-size:1.2rem;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:min(320px,100%)}
.note{font-size:.9rem;color:var(--muted);max-width:60ch}
.cert{border:3px double var(--ochre);border-radius:12px;padding:1.2rem 1.5rem;max-width:560px;margin:0 auto;text-align:center;background:var(--ochre-soft)}

.savestate{font-size:.78rem;opacity:.75;white-space:nowrap}
.savestate[data-s^="Not"]{color:#FFB4BF;opacity:1;font-weight:700}
.bad{color:var(--miss);font-weight:700;min-height:1.4em;margin:.6rem 0 0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.9rem}
.signin-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:460px}
.signin-grid label{font-weight:700;display:block;margin-bottom:.3rem}
.signin-grid input{width:100%}
.pin{letter-spacing:.4em}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td,.tbl th{text-align:left;padding:.3rem .5rem;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}
.tools select{font:inherit;padding:.35rem;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
/* Teacher overlay */
.overlay{position:fixed;inset:0;background:rgba(10,16,25,.55);display:none;place-items:center;z-index:20;padding:1rem}
.overlay.show{display:grid}
.sheet{background:var(--sheet);color:var(--ink);border-radius:14px;width:min(900px,100%);max-height:90%;overflow:auto;padding:1.2rem 1.4rem}
.trow{border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0}
.trow summary{cursor:pointer;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ans{font-size:.92rem;margin:.5rem 0;padding:.5rem .7rem;background:var(--paper);border-radius:8px}
.ans b{display:block;font-size:.8rem;color:var(--muted)}

@media (max-width:860px){
  .stage{grid-template-columns:1fr;padding:.6rem}
  .side{display:none}
  .brand span,.stat small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand"><h1>Winter Trail</h1><span>A reading journey with Changes for Kirsten</span></div>
    <div class="strip" aria-hidden="true"><i id="stripFill" style="width:0"></i></div>
    <div class="stats">
      <div class="stat" title="Level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V5l8-2 8 2v15"/><path d="M9 20v-5h6v5"/></svg><span id="sLevel">1</span><small>/ 22</small></div>
      <div class="stat" title="Stars"><svg viewBox="0 0 24 24"><path fill="#E5C06E" d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z"/></svg><span id="sStars">0</span></div>
      <div class="stat" title="Things for the new house"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg><span id="sKeep">0</span></div>
      <div class="stat" title="Winter badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5"/></svg><span id="sStamp">0</span><small>/ 5</small></div>
      <span class="savestate" id="saveState" aria-live="polite"></span><button class="hud-btn" id="outBtn" hidden>Sign out</button>
    </div>
  </header>
  <main class="stage">
    <section class="panel" aria-live="polite">
      <div class="panel-head"><div class="crumb" id="crumb"></div><div id="headRight"></div></div>
      <div class="panel-body" id="body"></div>
      <div class="panel-foot" id="foot"></div>
    </section>
    <aside class="side">
      <div class="card" id="map"></div>
      <div class="card trunk-card">
        <div class="trunk-wrap">
          <svg class="trunk" viewBox="0 0 120 90" aria-hidden="true">
            <path d="M6 84 Q60 72 114 84 V90 H6Z" fill="var(--snow)" stroke="var(--line)"/>
            <rect x="18" y="38" width="84" height="44" fill="#8C5A35"/>
            <path d="M18 46h84M18 54h84M18 62h84M18 70h84" stroke="#6B4126" stroke-width="1.2"/>
            <path d="M10 40 L60 10 L110 40Z" fill="#5B3A24"/><path d="M10 40 L60 10 L110 40" fill="none" stroke="var(--snow)" stroke-width="4" stroke-linejoin="round"/>
            <rect x="78" y="14" width="10" height="18" fill="#6E4A33"/>
            <rect x="28" y="48" width="18" height="16" fill="#F2C766" stroke="#3E2A1C" stroke-width="2"/><path d="M37 48v16M28 56h18" stroke="#3E2A1C" stroke-width="1.5"/>
            <rect x="74" y="48" width="18" height="16" fill="#F2C766" stroke="#3E2A1C" stroke-width="2"/><path d="M83 48v16M74 56h18" stroke="#3E2A1C" stroke-width="1.5"/>
            <rect x="53" y="56" width="14" height="26" fill="#3E2A1C"/>
          </svg>
          <div><h3>The new house</h3><p class="sub">Every finished level adds something for the family’s new home. Each finished chapter earns a winter badge.</p></div>
        </div>
        <div class="slots" id="slots"></div>
        <div class="stamps" id="stamps"></div>
      </div>
    </aside>
  </main>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- Icons ---------- */
const ICON={
 compass:'<circle cx="12" cy="12" r="9"/><path d="M12 5l2.5 7L12 19l-2.5-7z"/>',
 coin:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/>',
 ticket:'<path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/>',
 flower:'<circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="6.5" r="3"/><circle cx="17.2" cy="10.3" r="3"/><circle cx="15.2" cy="16.4" r="3"/><circle cx="8.8" cy="16.4" r="3"/><circle cx="6.8" cy="10.3" r="3"/>',
 lantern:'<path d="M9 5h6M12 2v3M8 7h8l1 12H7z"/><path d="M12 11v5"/>',
 key:'<circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M18 12v3M21 12v2"/>',
 ribbon:'<path d="M12 9c-3-5-8-4-7 0s5 2 7 0c2 2 6 4 7 0s-4-5-7 0z"/><path d="M10 11l-3 9 3-2 2 3M14 11l3 9-3-2"/>',
 kettle:'<path d="M5 11h12v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M17 13l4-2M8 11a3 3 0 0 1 6 0"/>',
 book:'<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/>',
 mitten:'<path d="M8 21V11a4 4 0 0 1 8 0v4l2-2a2 2 0 0 1 3 3l-5 5z"/><path d="M8 18h8"/>',
 anchor:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13a7 7 0 0 0 14 0M8 10h8"/>',
 pencil:'<path d="M4 20l3-1 12-12-2-2L5 17z"/><path d="M15 5l2 2"/>',
 watch:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M10 3h4"/>',
 seed:'<path d="M12 21c0-7 0-11 0-14"/><path d="M12 12c-4 0-6-3-6-6 4 0 6 3 6 6zM12 9c3 0 5-2 5-5-3 0-5 2-5 5z"/>',
 cup:'<path d="M5 6h11v7a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 9h2a2 2 0 0 1 0 4h-2"/>',
 basket:'<path d="M3 10h18l-2 10H5z"/><path d="M7 10l3-6M17 10l-3-6M8 14h8"/>',
 wheel:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>',

 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.5"/>',
 map:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
 snowshoe:'<ellipse cx="12" cy="12" rx="5" ry="9"/><path d="M8 8h8M7.5 12h9M8 16h8M12 3v18"/>',
 candle:'<path d="M9 21h6M10 21V10h4v11"/><path d="M12 10V8"/><path d="M12 7c-1.5-1.5-1-3 0-4.5 1 1.5 1.5 3 0 4.5z"/>',
 spool:'<path d="M7 4h10M7 20h10"/><rect x="8" y="6" width="8" height="12"/><path d="M8 9l8 2M8 13l8 2"/>',
 letter:'<rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3 7l9 6 9-6"/>',

L.push({ch:1,type:"history",title:"The fur trade",keep:["Fur-lined mittens","mitten"],

  ["Furs for the world","For about two hundred years before Kirsten’s time, furs were one of the most valuable things to come out of the northern woods. Beaver fur was pressed into felt for fine hats worn in Europe and in American cities. Traders paid for furs with goods like iron kettles, wool blankets, knives and cloth.|The Ojibwe and Dakota peoples were skilled trappers and hunters, and for many years they traded furs with French, British and American traders. French-Canadian canoe men called voyageurs paddled heavy loads of furs and trade goods along Minnesota’s rivers and lakes."],
  ["A trap line in winter","By the 1850s, fewer beaver hats were being made, but furs like muskrat, mink, fox and beaver could still bring good money. Winter was the best season for trapping, because animals grow their thickest fur in the cold.|A trap line was a path through the woods with traps set along the way. Trappers walked it on snowshoes, which spread a person’s weight across the snow so they did not sink. Back at home, each pelt was scraped clean and stretched on a frame to dry before it could be sold."]],
 qs:[
  {q:"Why was winter the best season for trapping?",c:["Animals grow their thickest fur in the cold","Animals sleep all winter and are easy to find","Traders only came in winter","Snow makes traps work better"],a:0,why:"Thick winter fur made the pelts worth the most."},
  {q:"Who were the voyageurs?",c:["French-Canadian canoe men who carried furs and trade goods","Swedish farmers","Soldiers who guarded the forts","Sailors on ocean ships"],a:0,why:"Voyageurs paddled canoes full of furs and trade goods along the rivers and lakes."},

L.push({ch:2,type:"history",title:"Fire on the frontier",keep:["Iron kettle","kettle"],

  ["Light and heat in a log cabin","In the 1850s, a farm family’s cabin was heated all winter by a fireplace or an iron stove that burned wood. After dark, the family had light from candles or from lamps that burned oil, such as lard oil or whale oil. Every flame was useful, and every flame had to be watched.|Log cabins were built of dry wood, and some early chimneys were made of sticks covered with clay. A spark from the hearth or a tipped-over lamp could start a fire that spread very quickly."],
  ["No fire trucks","Farms in Minnesota Territory were far apart, and there were no fire departments in the countryside. When a fire started, the family and the nearest neighbors fought it with buckets of water and shovels of snow. In winter, streams were often frozen, so water was hard to get quickly.|Because of this, families were very careful with fire. Children learned early to keep things away from the hearth and never to leave a candle burning alone. Today we have smoke alarms and firefighters, but the most important rule is still the same: get everyone out safely first."]],
 qs:[

L.push({ch:3,type:"history",title:"Winter in the logging camps",keep:["Pocket watch","watch"],
 pages:[
  ["Cutting the pine","Minnesota’s northern forests were full of tall white pine trees, and growing towns needed lumber for houses, barns and stores. In the 1850s, many farmers left home for the winter to work in logging camps. There they could earn wages during the months when no crops could grow.|Loggers lived in rough log bunkhouses deep in the woods. They worked from sunrise to sunset, cutting trees with axes and saws. Teams of oxen pulled the logs on sleds over the snow to the frozen riverbanks, where the logs were stacked and stamped with the owner’s mark."],
  ["The spring drive","The loggers had to wait for spring. When the river ice melted, the logs were rolled into the rushing water and floated downstream to the sawmills. This was called the log drive. Rivermen rode the floating logs and used long poles to break up log jams.|At sawmills, like the ones at St. Anthony Falls on the Mississippi River, the logs were cut into boards. Only after the drive could most loggers go home to their families. That is why so many fathers came home in April."]],
 qs:[
  {q:"Why did many farmers work in logging camps during the winter?",c:["They could earn wages when no crops could grow","They liked the cold","The camps were close to home","They had to by law"],a:0,why:"Winter meant no farm work in the fields, so logging gave them a way to earn money."},
  {q:"How did the logs get to the sawmills?",c:["They floated down the rivers in the spring log drive","Trains carried them all winter","Loggers carried them on their backs","Ships brought them from Sweden"],a:0,why:"When the ice melted, the logs were floated downstream in the log drive."},
  {q:"Why did so many loggers come home in April?",c:["They had to wait for the ice to melt and the log drive to finish","April was payday at every camp","The camps closed on the first of April","They wanted to plant flowers"],a:0,why:"The drive could only happen after the ice melted, so loggers came home in spring."}]});

  ["Beavers under the ice","Beavers do not sleep through the winter. In the fall, they store branches underwater near their lodge, a dome of sticks and mud. When the pond freezes, they swim under the ice to reach their food and return home without ever going outside.|As a beaver swims beneath the ice, air from its fur and breath can be trapped against the ice, leaving trails of frozen bubbles. A sharp-eyed trapper who knew the woods could read these trails like a map."],
  ["Steering by a star","Travelers without a compass found their way at night by the North Star, also called Polaris. While the other stars seem to wheel slowly across the sky during the night, the North Star stays almost in the same place, above the north.|To find it, people looked for the Big Dipper. The two stars at the end of the Dipper’s cup point toward the North Star. If you face the North Star, south is behind you, east is on your right, and west is on your left."]],

    go.disabled=true; sm.textContent="";
    try{
      const r=await rpc("winter_login",{p_name:name,p_pin:pin});
      if(!r||!r.ok){
        const e=r&&r.error;
        sm.textContent= e==="name"?"That name isn’t on the list. Check the spelling or ask your teacher."
          : e==="locked"?"Too many wrong PINs. Wait 5 minutes, or ask your teacher."
          : "That PIN doesn’t match. Try again.";
        pn.value=""; pn.focus(); return;
      }
      SESSION=r.token;
      P={name:r.name,level:r.level||0,stars:r.stars||[],answers:r.answers||{},attempts:r.attempts||{}};
      $("outBtn").hidden=false; setSaveState("Signed in"); poke(); home();
    }catch(e){ sm.textContent="Can’t reach the school server right now. Check the internet and try again."; }
    finally{ go.disabled=false; }
  };
  nm.focus();
}
$("outBtn").onclick=()=>signOut();

function home(){
  R=null; hud(); drawMap();
  if(!SESSION) return signIn();
  if(P.level>=TOTAL) return finale();
  const lv=L[P.level], chN=lv.ch, first=(chN-1)*4, chLevels=L.map((l,i)=>[l,i]).filter(([l])=>l.ch===chN);
  const t=TYPE[lv.type];
  setPanel(`<b>${esc(chName(chN))}</b>`,`
   <p class="crumb" style="margin:0 0 .3rem">Welcome back, ${esc(P.name)}.</p>
   <h2 class="title">${chN<=5?esc(chName(chN)):"The last days of winter"}</h2>
   <p class="lede">${chN<=5?`Finish all four levels of this chapter to earn the <b>${CH[chN-1].stamp}</b> winter badge.`:"Two levels stand between you and spring."}</p>
   <div class="journey-list">${chLevels.map(([l,i])=>{
     const st=i<P.level?"done":i===P.level?"now":"";
     return `<div class="jl ${st}"><span class="n">${i<P.level?"✓":i+1}</span><span><b>${esc(l.title)}</b><br><span class="crumb">${TYPE[l.type].label}</span></span><span class="st">${i<P.level?"★".repeat(P.stars[i]||0):i===P.level?"Up next":"Locked"}</span></div>`}).join("")}
   </div>`,
   `<span class="crumb">Level ${P.level+1} of ${TOTAL} &nbsp;·&nbsp; For the new house: <b>${esc(lv.keep[0])}</b></span><button class="btn" id="start">Begin level ${P.level+1}</button>`);
  $("start").onclick=()=>startLevel();
}

function startLevel(){
  const lv=L[P.level], steps=[{t:"intro"}];
  if(lv.type==="vocab") steps.push({t:"words"});
  if(lv.pages) lv.pages.forEach((p,k)=>steps.push({t:"page",p,k}));
  if(lv.type==="check") steps.push({t:"gate"});
  shuffle(lv.qs).forEach(q=>{const order=shuffle(q.c.map((c,i)=>i)); steps.push({t:"mc",q,order});});
  (lv.writes||[]).forEach((w,k)=>steps.push({t:"write",w,k}));
  R={lv,steps,i:0,right:0,total:lv.qs.length,answered:false,written:(P.answers[lv.id]||[]).slice()};
  render();
}
function crumbFor(lv){return `<b>Level ${P.level+1}</b> &nbsp;·&nbsp; ${esc(chName(lv.ch))}`}
function dots(){return `<div class="dots">${R.steps.map((s,k)=>`<i class="${k<R.i?"on":k===R.i?"now":""}"></i>`).join("")}</div>`}

function render(){
  const s=R.steps[R.i], lv=R.lv, t=TYPE[lv.type];
  const next=(label="Next",dis=false)=>`${dots()}<button class="btn" id="nx" ${dis?"disabled":""}>${label}</button>`;
  if(s.t==="intro"){
    setPanel(crumbFor(lv),`
     <span class="kind ${t.cls}">${t.label}</span>
     <h2 class="title">${esc(lv.title)}</h2>
     <p class="lede">${t.intro}</p>
     ${lv.note?`<p class="why">${lv.note}</p>`:""}
     <p class="note">Answer at least ${needFor(R.total)} of ${R.total} questions correctly to move on.${lv.writes?` You’ll also write ${lv.writes.length===1?"one short answer":lv.writes.length+" short answers"}.`:""} First-try perfect scores earn three stars.</p>
     <div style="display:flex;align-items:center;gap:1rem;margin-top:1rem"><div class="slot got" style="width:52px;height:52px">${ico(lv.keep[1])}</div><div><b>For the new house</b><br><span class="crumb">${esc(lv.keep[0])}</span></div></div>`,next("Start"));
  }
  else if(s.t==="words"){
    setPanel(crumbFor(lv),`<span class="kind sea">Word chest</span><h2 class="title" style="font-size:1.5rem">Study these five words</h2>
     <div class="words">${lv.words.map(w=>`<div class="word"><b>${w[0]}</b><p>${w[1]}</p><em>${w[2]}</em><div style="margin-top:.4rem">${speakBtn(w[0]+". "+w[1]+" "+w[2])}</div></div>`).join("")}</div>`,next("I’m ready for the quiz"));
  }
  else if(s.t==="page"){
    setPanel(crumbFor(lv),`<span class="kind ochre">Field notes · page ${s.k+1} of ${lv.pages.length}</span>
     <h2 class="title" style="font-size:1.6rem">${s.p[0]}</h2>
     <div style="margin-bottom:.6rem">${speakBtn(s.p[0]+". "+s.p[1].replace(/\|/g," "))}</div>
     <div class="prose">${s.p[1].split("|").map(x=>`<p>${x}</p>`).join("")}</div>`,next(s.k+1<lv.pages.length?"Turn the page":"On to the questions"));
  }
  else if(s.t==="gate"){
    setPanel(crumbFor(lv),`<div class="gate">
      <svg viewBox="0 0 120 90" aria-hidden="true"><path d="M8 14 Q34 6 60 16 V84 Q34 74 8 82Z" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2"/><path d="M112 14 Q86 6 60 16 V84 Q86 74 112 82Z" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2"/>${[28,38,48,58].map(y=>`<path d="M18 ${y} q16-4 32 2 M70 ${y+2} q16-6 32-2" stroke="var(--muted)" stroke-width="1.5" fill="none"/>`).join("")}<path d="M92 10 v26 l5-4 5 4 V10" fill="var(--berry)"/></svg>
      <div><span class="kind berry">Reading time</span><h2 class="title" style="font-size:1.6rem">Read ${esc(chName(lv.ch))}</h2><p class="lede">Open your copy of <i>Changes for Kirsten</i> and read the whole chapter. Take your time — the questions ask about details.</p></div></div>
      <label style="display:flex;gap:.6rem;align-items:center;font-weight:700;margin-top:.6rem"><input type="checkbox" id="rd" style="width:1.2rem;height:1.2rem"> I’ve finished reading the chapter</label>`,next("Start the questions",true));
    $("rd").onchange=e=>$("nx").disabled=!e.target.checked;
  }
  else if(s.t==="mc"){
    const n=R.steps.filter(x=>x.t==="mc").indexOf(s)+1;
    setPanel(crumbFor(lv),`<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem"><span class="kind ${t.cls}">Question ${n} of ${R.total}</span>${speakBtn(s.q.q+" "+s.order.map((o,k)=>"ABCD"[k]+". "+s.q.c[o]).join(". "))}</div>
     <p class="q">${s.q.q}</p>
     <div class="choices">${s.order.map((o,k)=>`<button class="choice" data-o="${o}"><span class="ltr">${"ABCD"[k]}</span><span>${s.q.c[o]}</span></button>`).join("")}</div>
     <div id="fb"></div>`,next("Next",true));
    R.answered=false;
    document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      if(R.answered) return; R.answered=true;
      const o=+b.dataset.o, ok=o===s.q.a;
      if(ok) R.right++;
      document.querySelectorAll(".choice").forEach(x=>{x.disabled=true; if(+x.dataset.o===s.q.a) x.classList.add("right");});
      if(!ok) b.classList.add("wrong");
      $("fb").innerHTML=`<div class="why ${ok?"":"miss"}"><b>${ok?"Correct!":"Not quite."}</b> ${s.q.why}</div>`;
      $("nx").disabled=false; $("nx").focus();
    });
  }
  else if(s.t==="write"){
    const prev=R.written[s.k]||"";
    setPanel(crumbFor(lv),`<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem"><span class="kind">Short answer ${s.k+1} of ${lv.writes.length}</span>${speakBtn(s.w.p)}</div>
     <p class="q">${s.w.p}</p>
     <textarea id="ta" placeholder="Write in complete sentences…">${esc(prev)}</textarea>
     <div class="count" id="ct"></div><div id="fb"></div>`,
     `${dots()}<span style="display:flex;gap:.5rem"><button class="btn quiet" id="chk">Check my answer</button><button class="btn" id="nx" disabled>Next</button></span>`);
    const ta=$("ta"), ct=$("ct");
    const wc=()=>ta.value.trim().split(/\s+/).filter(Boolean).length;
    const upd=()=>{const c=wc(); ct.textContent=c>=s.w.min?`${c} words — great.`:`${c} of at least ${s.w.min} words`; $("chk").disabled=c<s.w.min;};
    ta.oninput=()=>{upd(); $("nx").disabled=true; $("fb").innerHTML="";}; upd();
    $("chk").onclick=()=>{R.written[s.k]=ta.value.trim(); $("fb").innerHTML=`<div class="why"><b>Compare your answer.</b> ${s.w.model}<br><span class="crumb">If you’d like to add more, edit your answer now — then tap Next.</span></div>`; $("nx").disabled=false;};
    ta.focus();
  }
  const nx=$("nx");
  if(nx) nx.onclick=()=>{
    if(s.t==="write"){R.written[s.k]=$("ta").value.trim();}
    if(window.speechSynthesis) speechSynthesis.cancel();
    if(R.i<R.steps.length-1){R.i++;render();} else finish();
  };
}

function finish(){
  const lv=R.lv, need=needFor(R.total), pass=R.right>=need;
  P.answers[lv.id]=R.written;
  if(!pass){
    P.attempts[lv.id]=(P.attempts[lv.id]||0)+1; save("retry",`Level ${P.level+1}: ${R.right} of ${R.total}, trying again`);
    setPanel(crumbFor(lv),`<div class="center"><h2 class="title">Almost there</h2>
      <p class="lede" style="margin:0 auto 1rem">You got <b>${R.right} of ${R.total}</b>. You need ${need} to move on. ${lv.type==="check"?"Look back at the chapter in your book, then":"Review the explanations, then"} try this level again — the questions will be in a new order.</p>
      <div class="bigstars">${[0,1,2].map(()=>STAR.replace("<svg",'<svg class="off"')).join("")}</div></div>`,
      `<span class="crumb">${lv.writes?"Your written answers are saved.":""}</span><button class="btn" id="again">Try level ${P.level+1} again</button>`);
    $("again").onclick=startLevel; return;
  }
  const firstTry=!(P.attempts[lv.id]>0);
  const stars=firstTry?(R.right===R.total?3:2):1;
  const from=P.level;
  P.stars[from]=stars; P.level++;
  const chapterDone=lv.ch<=5&&P.level===lv.ch*4;
  save("level",`Finished level ${from+1} (${lv.title}): ${R.right} of ${R.total}, ${stars} star${stars>1?"s":""}`); hud(from);
  setPanel(crumbFor(lv),`<div class="center">
     <div class="medal">${ico(lv.keep[1])}</div>
     <h2 class="title" style="margin-top:.8rem">Added to the new house: ${esc(lv.keep[0])}</h2>
     <div class="bigstars">${[0,1,2].map(k=>STAR.replace("<svg",`<svg class="${k<stars?"on":"off"}"`)).join("")}</div>
     <p class="lede" style="margin:0 auto">${R.right} of ${R.total} correct${firstTry?"":" (after another try)"}. ${stars===3?"A perfect first try!":stars===2?"Strong work.":"You kept going. That’s what pioneers do."}</p>
     ${chapterDone?`<div class="cert" style="margin-top:1rem;padding:.7rem 1rem"><b class="serif" style="font-size:1.3rem">Winter badge earned: ${CH[lv.ch-1].stamp}</b><br><span class="crumb">You’ve finished ${esc(chName(lv.ch))}.</span></div>`:""}
   </div>`,`<span class="crumb">Level ${from+1} complete and locked in.</span><button class="btn" id="cont">Continue on the trail</button>`);
  $("cont").onclick=()=>{ home(); placeMarker(P.level,from); };
}

function finale(){
  setPanel("<b>Spring has come</b>",`<div class="cert">
    <p class="crumb" style="margin:0">Minnesota, April 1855</p>
    <h2 class="title">${esc(P.name)} has made it through the winter</h2>
    <p>Every chapter of <i>Changes for Kirsten</i> read, every room of the new house filled, all five winter badges earned.</p>
    <div class="bigstars">${STAR.replace("<svg",'<svg class="on"')}</div>
    <p class="serif" style="font-size:1.6rem;margin:.2rem 0">${totalStars()} of ${TOTAL*3} stars</p>
  </div>`,`<span class="crumb">Welcome home. Ask your teacher about the next book.</span><span></span>`);
}

/* ---------- Teacher view (uses the portal’s teacher password) ---------- */
let TPASS=null;
function closeTeacher(){ $("overlay").classList.remove("show"); TPASS=null; if(location.hash==="#teacher") history.replaceState(null,"",location.pathname); }
function teacherLogin(){
  const ov=$("overlay"), sh=$("sheet"); ov.classList.add("show");
  sh.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="title" style="font-size:1.6rem;margin:0">Teacher view</h2><button class="btn quiet" id="cls">Close</button></div>
   <p class="note">Enter the teacher password you use for the school portal.</p>
   <input id="tp" type="password" class="namefield" autocomplete="off"> <button class="btn" id="tgo">Open</button>
   <p class="bad" id="tm"></p>`;
  $("cls").onclick=closeTeacher;
  const go=async()=>{
    $("tm").textContent=""; $("tgo").disabled=true;
    try{ const d=await rpc("winter_admin_data",{p_pass:$("tp").value}); TPASS=$("tp").value; renderTeacher(d); }
    catch(e){ $("tm").textContent=/password/i.test(e.message)?"That password doesn’t match.":e.message; }
    finally{ const b=$("tgo"); if(b) b.disabled=false; }
  };
  $("tgo").onclick=go; $("tp").addEventListener("keydown",e=>{if(e.key==="Enter") go();}); $("tp").focus();
}
const when=(t)=>{ if(!t) return "—"; const d=new Date(t); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+", "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
function renderTeacher(d){
  const sh=$("sheet"), rows=(d&&d.students)||[], log=(d&&d.log)||[];
  sh.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="title" style="font-size:1.6rem;margin:0">Teacher view</h2><span style="display:flex;gap:.5rem"><button class="btn quiet" id="rf">Refresh</button><button class="btn quiet" id="cls">Close</button></span></div>
  <p class="note">${rows.length} student${rows.length===1?" has":"s have"} started Winter Trail. Students sign in with their portal name and PIN; add new students in the portal.</p>
  ${rows.length?rows.map(r=>{
    const st=(r.stars||[]).reduce((a,b)=>a+(b||0),0), mine=log.filter(l=>l.student_id===r.id).slice(0,40), ans=r.answers||{};
    const written=L.map(l=>{const a=ans[l.id]; if(!a||!a.length) return ""; return (l.writes||[]).map((w,k)=>a[k]?`<div class="ans"><b>${esc(l.title)} — ${esc(chName(l.ch))}</b><i>${esc(w.p)}</i><br>${esc(a[k])}</div>`:"").join("")}).join("");
    return `<details class="trow"><summary><b>${esc(r.name)}</b><span>${r.level>=TOTAL?"Finished!":"On level "+(r.level+1)+" of "+TOTAL}</span><span>★ ${st} of ${TOTAL*3}</span><span class="crumb">Last active ${when(r.updated_at)}</span></summary>
      <h4 style="margin:.8rem 0 .3rem">Activity</h4>
      ${mine.length?`<div style="max-height:220px;overflow:auto"><table class="tbl"><tbody>${mine.map(l=>`<tr><td style="white-space:nowrap">${when(l.at)}</td><td>${l.event==="in"?"Signed in":l.event==="out"?"Signed out":l.event==="level"?"✓":l.event==="retry"?"Retry":"Teacher"}</td><td>${esc(l.detail||"")}</td></tr>`).join("")}</tbody></table></div>`:'<p class="crumb">No activity yet.</p>'}
      <h4 style="margin:.8rem 0 .3rem">Written answers</h4>${written||'<p class="crumb">No written answers yet.</p>'}
      <div class="tools"><label>Move to level <select data-lvsel="${esc(r.id)}">${L.map((l,i)=>`<option value="${i}" ${i===Math.min(r.level,TOTAL-1)?"selected":""}>${i+1}. ${esc(l.title)}</option>`).join("")}</select></label><button class="btn quiet" data-setlv="${esc(r.id)}">Move</button><button class="btn quiet" data-reset="${esc(r.id)}">Start over at level 1</button></div>
    </details>`}).join(""):'<p>No one has signed in yet. Add the student in the portal’s teacher area, then have them sign in here.</p>'}`;
  $("cls").onclick=closeTeacher;
  $("rf").onclick=async()=>{ try{renderTeacher(await rpc("winter_admin_data",{p_pass:TPASS}));}catch(e){} };
  sh.querySelectorAll("[data-setlv]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.setlv, lv=+sh.querySelector(`[data-lvsel="${id}"]`).value;
    if(!confirm(`Move this student to level ${lv+1}? Stars and answers already earned stay.`)) return;
    try{ await rpc("winter_admin_set_level",{p_pass:TPASS,p_student:id,p_level:lv}); renderTeacher(await rpc("winter_admin_data",{p_pass:TPASS})); }catch(e){ alert(e.message); }
  });
  sh.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Start this student over at level 1? Their stars, keepsakes and written answers will be cleared.")) return;
    try{ await rpc("winter_admin_reset",{p_pass:TPASS,p_student:b.dataset.reset}); renderTeacher(await rpc("winter_admin_data",{p_pass:TPASS})); }catch(e){ alert(e.message); }
  });
}
$("overlay").addEventListener("click",e=>{if(e.target.id==="overlay") closeTeacher();});

/* ---------- Boot ---------- */
signIn();
if(location.hash==="#teacher") teacherLogin();
</script>
</body>
</html>
