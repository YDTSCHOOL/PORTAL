<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Karts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e111a; --panel:#171b27; --panel2:#212738; --line:#2e3548;
  --text:#eef0f5; --muted:#9ba3b9; --amber:#ffb627; --amber-ink:#1a1200; --amber-soft:#3a2f12;
  --cyan:#4fd1e6; --good:#4ade80; --bad:#f87171; --good-soft:#15301f; --bad-soft:#3b1c1c; --flame:#ff6b35; --red:#e5383b;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e111a; --panel:#171b27; --panel2:#212738; --line:#2e3548;
    --text:#eef0f5; --muted:#9ba3b9; --amber:#ffb627; --amber-ink:#1a1200; --amber-soft:#3a2f12;
    --cyan:#4fd1e6; --good:#4ade80; --bad:#f87171; --good-soft:#15301f; --bad-soft:#3b1c1c; --flame:#ff6b35; --red:#e5383b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e111a; --panel:#171b27; --panel2:#212738; --line:#2e3548;
  --text:#eef0f5; --muted:#9ba3b9; --amber:#ffb627; --amber-ink:#1a1200; --amber-soft:#3a2f12;
  --cyan:#4fd1e6; --good:#4ade80; --bad:#f87171; --good-soft:#15301f; --bad-soft:#3b1c1c; --flame:#ff6b35; --red:#e5383b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:"Big Shoulders Display","Barlow",Impact,sans-serif;font-weight:800;letter-spacing:.01em;line-height:1}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.72em;line-height:1.08;text-align:center;margin:0 1px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}

.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 18px;max-width:1160px;margin:0 auto}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:12px}
.brand b{font-size:32px}
.brand span{color:var(--muted);font-size:15px}
.stat{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 8px}
.stat svg{flex:none}
.stat strong{font-size:19px;font-weight:700}
.stat .xp{display:flex;flex-direction:column;gap:3px;min-width:90px}
.stat .xp small{font-size:12px;color:var(--muted);line-height:1}
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:4px;transition:width .6s ease}
.bar.good i{background:var(--good)}
.menu{display:flex;gap:6px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:14px;color:var(--muted)}
.ghost:hover{color:var(--text);border-color:var(--muted)}
main{max-width:1160px;margin:0 auto;padding:0 18px 60px}
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:10px;padding:11px 20px;font-weight:700;font-size:17px}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:20px;padding:14px 26px}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--amber)}
.btn.good{background:var(--good);color:#06240f}
body{background:radial-gradient(1200px 500px at 50% -120px,#1d2440 0,transparent 70%),var(--bg)}
.brand b{letter-spacing:.06em}
.brand b i{font-style:normal;color:var(--red)}
.hero>.stage{align-self:start}
.track{position:relative;border-radius:14px;overflow:hidden;background:#0b0e18;margin-bottom:12px;aspect-ratio:16/8.4;border:1px solid var(--line)}
.track canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lbl{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px}
.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tracks button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 4px 6px;text-align:center;line-height:1.15;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.tracks button svg{border-radius:7px;display:block}
.tracks button b{font-size:13.5px}
.tracks button small{font-size:11.5px;color:var(--muted)}
.tracks button[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.tracks button:disabled{opacity:.45;cursor:not-allowed}
.tracks button:disabled svg{filter:grayscale(1) brightness(.6)}
.paint{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swatches button{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);position:relative}
.swatches button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--amber)}
.swatches button:disabled{cursor:not-allowed}
.swatches button:disabled::after{content:attr(data-lvl);position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,20,.7);border-radius:10px;font-size:11px;font-weight:700;color:#cfd3df}
.frow2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.frow2 input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:17px;color:var(--text)}
.sheet.wide{max-width:980px}
.crun{position:relative}
.crun .cv{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0b0e18;width:min(100%,calc((100vh - 250px)*16/9));margin:0 auto}
.crun canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.steer{display:flex;gap:10px;margin:10px auto 0;width:min(100%,calc((100vh - 250px)*16/9))}
.steer button{flex:1;font-size:28px;font-weight:800;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);user-select:none;-webkit-user-select:none;touch-action:none}
.steer button:active,.steer button.on{background:var(--amber);color:var(--amber-ink)}
.steer button.n{font-size:18px;flex:.7}
.bonusbtn{width:100%;margin-top:8px;background:linear-gradient(90deg,#1b6fd6,#4fd1e6);color:#04121f}
.drive{max-width:1100px;margin:0 auto}
.track.big{aspect-ratio:16/9;width:min(100%,calc((100vh - 230px)*16/9));margin:0 auto 10px}
.dsteer{width:min(100%,calc((100vh - 230px)*16/9));margin:0 auto}
.dsteer button.nitro{background:linear-gradient(180deg,#1b6fd6,#1f4f9a);color:#eaf6ff;border-color:#2f6fd6}
.dhelp{text-align:center;font-size:14.5px;margin:8px 0 0}
.pitbox{border-radius:14px;overflow:hidden;line-height:0;margin-bottom:12px;border:1px solid var(--line)}
.pitbox svg,.tutimg svg{width:100%;height:auto;display:block}
.tutimg{border-radius:12px;overflow:hidden;line-height:0;margin:-4px 0 12px;background:#141a2a}
.pitlbl{font-weight:700;color:var(--amber);font-family:"Big Shoulders Display",Barlow,sans-serif;font-size:22px;letter-spacing:.02em}
.crew.work .arm,.crew.work .tool{animation:crewwork .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
.crew.done .arm{animation:cheer .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
.crew.wait{opacity:.85}
@keyframes crewwork{from{transform:translateY(-2px) rotate(-4deg)}to{transform:translateY(2px) rotate(4deg)}}
@keyframes cheer{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.dov{display:flex;gap:8px;align-items:center;font-size:14.5px;margin:4px 0 6px;color:var(--text)}
.dov input{width:18px;height:18px;accent-color:var(--amber)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.podium{border-radius:14px;overflow:hidden;line-height:0;margin:-4px 0 12px}
.podium svg{width:100%;height:auto;display:block}
.kstat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kstat span{font-size:12.5px;background:var(--panel2);border-radius:999px;padding:3px 10px;color:var(--muted)}

/* stage */
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0f1220;line-height:0}
.stage svg{width:100%;height:auto;display:block}
.beam,.spotb{opacity:0;transition:opacity .8s ease}
.idle .beam{opacity:.35}
.show .beam,.show .spotb{opacity:1}
.ledcell{opacity:.25}
.show .ledcell,.idle .ledcell{opacity:.85}
.show .crowd g{animation:bob .55s ease-in-out infinite alternate}
.show .ledcell{animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes pulse{from{opacity:.35}to{opacity:1}}

/* hub */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{margin:0 0 6px;font-size:30px}
.card p{margin:0 0 8px}
.muted{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 6px;text-align:center;line-height:1.2}
.seg button b{display:block;font-size:15px}
.seg button small{color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber);background:var(--amber-soft)}
.missions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mis{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:15px}
.mis .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.mis.done .ck{background:var(--good);border-color:var(--good);color:var(--panel)}
.mis.done span{color:var(--muted);text-decoration:line-through}
.mis small{color:var(--muted)}
h3.sec{font-family:"Big Shoulders Display","Barlow",sans-serif;font-weight:800;font-size:28px;margin:32px 0 12px}
.prog3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.bigl{display:flex;align-items:center;gap:16px}
.bigl .ring{width:84px;height:84px;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:24px}
.stats small{color:var(--muted);font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.skill.lock{opacity:.55}
.skill .hd{display:flex;align-items:center;gap:10px}
.skill .ic{width:44px;height:44px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none}
.skill b{font-size:17px;line-height:1.2}
.skill small{color:var(--muted);font-size:13.5px}
.stars{color:var(--amber);letter-spacing:2px;font-size:18px}
.stars .off{color:var(--line)}
.skill .acts{display:flex;gap:8px;margin-top:4px}
.skill .acts .btn{font-size:14.5px;padding:8px 12px;flex:1}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tro b{font-size:14.5px;line-height:1.2}
.tro small{color:var(--muted);font-size:12.5px;line-height:1.25}
.tro.off{opacity:.42}
.tro.off svg{filter:grayscale(1)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item .ic{background:#141826;border-radius:8px;line-height:0}
.item b{font-size:16px}
.item small{color:var(--muted);font-size:13.5px;line-height:1.3;flex:1}
.item .owned{color:var(--good);font-weight:600;font-size:14px}
.item .btn{font-size:15px;padding:8px 12px}
.item .boost{font-size:13px;color:var(--good);font-weight:600}

/* challenge */
.cbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cbar .dots{display:flex;gap:6px;margin-right:auto}
.cbar .dots i{width:26px;height:10px;border-radius:5px;background:var(--panel2)}
.cbar .dots i.on{background:var(--amber)}
.cbar .dots i.ok{background:var(--good)}
.combo{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px}
.combo.hot{border-color:var(--flame);color:var(--flame)}
.chal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.scene{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--panel2);border:2px solid var(--line)}
.av.dovid{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:18px}
.bubble b.who{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.vis{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;place-items:center;min-height:160px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.ask{font-size:24px;font-weight:600;line-height:1.3;margin:0 0 12px}
.field{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;font-size:30px}
.field:focus-within{border-color:var(--amber)}
.field span{color:var(--muted)}
.field input{border:0;background:transparent;width:100%;min-width:0;padding:10px 6px;font-size:30px;outline:none;font-variant-numeric:tabular-nums}
.field.small{font-size:22px;padding:0 10px}
.field.small input{font-size:22px;padding:6px 4px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.keypad button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 0;font-size:22px;font-weight:600}
.keypad button:active{transform:translateY(1px)}
.keypad button.wide{font-size:15px}
.checkrow{display:flex;gap:10px;margin-top:10px}
.checkrow .btn{flex:1}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choices .btn{flex:1;min-width:120px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tools button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px;font-weight:600;line-height:1.15}
.tools button:disabled{opacity:.4;cursor:default}
.tools button.help{border-color:var(--amber);background:var(--amber-soft)}
.tools svg{width:24px;height:24px}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:17px;display:none}
.fb.on{display:block}
.fb.good{background:var(--good-soft)}
.fb.soft{background:var(--amber-soft)}
.fb .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.guide{margin-top:12px;border:2px solid var(--amber);border-radius:14px;padding:14px;background:var(--panel)}
.guide .gh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.guide .gh p{margin:0;font-size:15.5px}
.gs{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.gs .n{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:13px;font-weight:700}
.gs.done .n{background:var(--good);color:var(--panel)}
.gs.cur .n{background:var(--amber);color:var(--amber-ink)}
.gs .q{font-size:17px}
.gs .a{font-weight:700;color:var(--good)}
.gs .row{display:flex;gap:8px;margin-top:6px;align-items:center}
.gs .row .field{flex:1}
.gs .hint{margin-top:6px;font-size:15px;background:var(--amber-soft);border-radius:8px;padding:7px 10px}
.gs.later{opacity:.45}

/* visuals */
.rcpt{background:#fffdf6;color:#2a2a26;font:15px/1.5 "Courier New",monospace;padding:14px 18px;min-width:240px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.rcpt .rl{display:flex;justify-content:space-between;gap:16px}
.rcpt .tot{border-top:1px dashed #999;margin-top:6px;padding-top:6px;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:74px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:2px}
.tile b{font-size:17px}
.tile small{font-size:11.5px;color:var(--muted)}
.tile.half{border-style:dashed}
.splitv{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.pile{display:flex;flex-direction:column;align-items:center;gap:4px}
.pile b{font-size:22px}
.crew{display:flex;flex-wrap:wrap;gap:6px;max-width:300px;justify-content:center}
.person{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.fbar{width:100%;max-width:440px}
.fbar svg{width:100%;height:auto;display:block}
.packs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pack{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);text-align:center;min-width:140px}
.pack small{display:block;color:var(--muted);font-weight:600}
.pack .cbl{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:150px;margin:6px auto}
.pack b{font-size:18px}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
.ledger>div{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.ledger .in{background:var(--good-soft)}
.ledger .out{background:var(--bad-soft)}
.ledger b{font-size:22px}
.ledger span{font-size:13px;color:var(--muted)}
.lens{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.lenrow{display:flex;align-items:center;gap:10px}
.lenrow i{height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--amber) 0 18px,transparent 18px 20px)}
.lenrow b{white-space:nowrap;font-size:18px}
.vlabel{font-weight:700;font-size:18px;margin-bottom:8px;text-align:center}

.rtab{border-collapse:collapse;font-size:20px;min-width:240px}
.rtab th{font-size:14px;color:var(--muted);font-weight:600;padding:4px 18px;border-bottom:2px solid var(--line)}
.rtab td{text-align:center;padding:8px 18px;font-weight:700;border-bottom:1px solid var(--line)}
.rtab tr.q td{color:var(--amber)}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.chain>div{border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;background:var(--panel2)}
.chain>div.pos{background:var(--good-soft)}.chain>div.neg{background:var(--bad-soft)}
.chain span{font-size:13px;color:var(--muted)}.chain b{font-size:20px}.chain i{color:var(--muted);font-style:normal}
.eqv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:20px;font-weight:700}
.eqv span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.eqv span.tot{background:var(--amber-soft);border-color:var(--amber)}.eqv i{font-style:normal;color:var(--muted)}

const D = (q, ans, o = {}) => Object.assign({q, ans}, o);
function addGuide(a, b){
  const at = a - a%10, bt = b - b%10, ao = a%10, bo = b%10, s = [];
  s.push(D(`Add the tens first: $${at} + $${bt}`, at+bt, {pre:'$', hint:`Think ${at/10} + ${bt/10} = ${at/10+bt/10}, then put a zero on the end.`}));
  if (ao + bo) s.push(D(`Now add the ones: $${ao} + $${bo}`, ao+bo, {pre:'$'}));
  if (ao + bo) s.push(D(`Put them together: $${at+bt} + $${ao+bo}`, a+b, {pre:'$'}));
  return s;
}
function mulGuide(h, rate){
  if (rate % 10 === 0) return [D(`Leave off the zero for now: ${h} × ${rate/10}`, h*rate/10, {hint:`Count by ${rate/10}s, ${h} times.`}), D(`Now put the zero back on: ${h} × $${rate}`, h*rate, {pre:'$'})];
  const t = rate - rate%10, o = rate%10;
  return [D(`Split $${rate} into $${t} and $${o}. First: ${h} × $${t}`, h*t, {pre:'$', hint:`${h} × ${t/10} = ${h*t/10}, then add a zero.`}), D(`Next: ${h} × $${o}`, h*o, {pre:'$'}), D(`Add them: $${h*t} + $${h*o}`, h*rate, {pre:'$'})];
}
const timesRow = (n, upto = 10) => Array.from({length:upto}, (_,i) => `${n} × ${i+1} = ${n*(i+1)}`).join(', ');
function divGuide(T, n, q){
  if (q <= 10) return [D(`What number times ${n} makes ${T}?  ${n} × ? = ${T}`, q, {pre:'$', hint:`Count by ${n}s: ${timesRow(n)}.`})];
  if (q % 10 === 0) return [D(`$${T} is ${T/10} tens. Share ${T/10} tens between ${n}: ${T/10} ÷ ${n}`, q/10, {post:'tens', hint:`${n} × ? = ${T/10}`}), D(`So each person gets ${q/10} tens. That’s`, q, {pre:'$'})];
  const c = q - q%10, left = T - n*c;
  return [D(`Hand each of the ${n} people $${c} first. How much is that in all? ${n} × $${c}`, n*c, {pre:'$', hint:`${n} × ${c/10} = ${n*c/10}, then add a zero.`}),
    D(`How much is left? $${T} − $${n*c}`, left, {pre:'$'}),
    D(`Share what’s left: $${left} ÷ ${n}`, q-c, {pre:'$', hint:`Count by ${n}s: ${timesRow(n)}.`}),
    D(`Each person gets $${c} + $${q-c}`, q, {pre:'$'})];
}
function pctGuide(T, p){
  const ten = T/10;
  if (p === 10) return [D(`10% means 1 out of 10 equal parts: $${T} ÷ 10`, ten, {pre:'$', hint:'Dividing by 10: just take off the last zero.'})];
  if (p === 50) return [D(`50% is half: $${T} ÷ 2`, T/2, {pre:'$'})];
  if (p === 25) return [D(`25% is a quarter. First find half: $${T} ÷ 2`, T/2, {pre:'$'}), D(`Now half of that: $${T/2} ÷ 2`, T/4, {pre:'$'})];
  const s = [D(`First find 10%: $${T} ÷ 10`, ten, {pre:'$', hint:'Take off the last zero.'})];
  if (p % 10 === 0) s.push(D(`${p}% is ${p/10} groups of 10%: ${p/10} × $${fmt(ten)}`, ten*p/10, {pre:'$'}));
  else {
    s.push(D(`5% is half of 10%: half of $${fmt(ten)}`, ten/2, {pre:'$'}));
    const k = (p-5)/10;
    if (k > 1) s.push(D(`${p-5}% is ${k} groups of 10%: ${k} × $${fmt(ten)}`, ten*k, {pre:'$'}));
    if (k >= 1) s.push(D(`${p}% = ${p-5}% + 5%: $${fmt(ten*k)} + $${fmt(ten/2)}`, T*p/100, {pre:'$'}));
  }
  return s;
}
function subGuide(a, b){
  const bh = b - b%100, bt = b%100, s = [];
  if (bh && bt) return [D(`Take away the hundreds first: $${a} − $${bh}`, a-bh, {pre:'$'}), D(`Now take away the rest: $${a-bh} − $${bt}`, a-b, {pre:'$'})];

}

/* ===== long division: steps and the animated "house" ===== */
function ldStages(N, d){
  const g = String(N).split('').map(Number), st = [];
  let i = 0, cur = g[0];
  while (cur < d && i < g.length - 1){ i++; cur = cur*10 + g[i]; }
  for (;;){
    const q = Math.floor(cur/d), prod = q*d, rem = cur - prod;
    st.push({pos:i, cur, q, prod, rem, next: i < g.length-1 ? g[i+1] : null});
    if (i >= g.length - 1) break;
    i++; cur = rem*10 + g[i];
  }
  return st;
}
// k = how many guide steps are done (2 per stage: the digit on top, then the subtraction)
function visLong(N, d, k = 0, opts = {}){
  const g = String(N).split(''), n = g.length, st = ldStages(N, d), done = k >= st.length*2;
  const cell = (t, cls = '') => `<span class="${cls}">${t}</span>`;
  const rows = [];
  // quotient row
  const qrow = Array(n).fill('');
  st.forEach((x, j) => { if (k >= 2*j+1) qrow[x.pos] = cell(x.q, k === 2*j+1 ? 'pop new' : 'q'); });
  rows.push(`<div class="ldr">${cell('')}${qrow.map(c => c || cell('')).join('')}</div>`);
  rows.push(`<div class="ldr"><span class="ldd">${d}</span>${g.map((c, j) => cell(c, 'dv' + (j === 0 ? ' first' : '') + (opts.dot === j ? ' dot' : ''))).join('')}</div>`);
  st.forEach((x, j) => {
    if (k < 2*j+1) return;
    const ps = String(x.prod), start = x.pos - ps.length + 1, row = Array(n).fill(cell(''));
    ps.split('').forEach((c, m) => row[start+m] = cell(c, 'ul' + (k === 2*j+1 ? ' pop' : '')));
    if (start - 1 >= 0) row[start-1] = cell('−', 'mi'); 
    rows.push(`<div class="ldr">${cell(start - 1 < 0 ? '−' : '', 'mi')}${row.join('')}</div>`);
    if (k < 2*j+2) return;
    const rs = String(x.rem), rrow = Array(n).fill(cell(''));
    rs.split('').forEach((c, m) => rrow[x.pos - rs.length + 1 + m] = cell(c, k === 2*j+2 ? 'pop' : ''));
    if (x.next !== null && j < st.length-1) rrow[x.pos+1] = cell(x.next, 'bd' + (k === 2*j+2 ? ' pop' : ''));
    rows.push(`<div class="ldr">${cell('')}${rrow.join('')}</div>`);
  });
  const last = st[st.length-1];
  const tail = done ? `<div class="ldans pop">${N} ÷ ${d} = <b>${Math.floor(N/d)}</b>${last.rem ? ` <span>R ${last.rem}</span>` : ''}</div>` : '';
  return `<div class="ld" style="--n:${n}">${rows.join('')}</div>${tail}`;
}

        guide:[D(`Real length: ${L} × ${sc}`, rl, {post:'feet'}), D(`Real width: ${W} × ${sc}`, rw, {post:'feet'}), D(`Area = length × width: ${rl} × ${rw}`, rl*rw, {post:'sq ft'})]}; }
    if (t === 3){ const d = pick([6,8,10,12,14,20]), C = r2(3.14*d);
      return {scene:`A round skid pad is ${d} feet across. You paint a line all the way around the edge. Use π ≈ 3.14.`, ask:'How many feet of line?', ans:C, post:'feet', vis:visCircle(`${d} ft`, 'edge'),
        guide:[D(`Around a circle = π × diameter = 3.14 × ${d}. Start with 3 × ${d}`, 3*d), D(`Now the 0.14 part: 0.14 × ${d}`, r2(.14*d), {hint:`14 × ${d} = ${14*d}, then move the decimal point 2 places left.`}), D(`Add them: ${3*d} + ${fmt(.14*d)}`, C, {post:'feet'})]}; }
    const r = pick([3,4,5,6,8,10]), A = r2(3.14*r*r);
    return {scene:`The turntable in your garage is a circle with a radius of ${r} feet. You cover it with rubber mat. Use π ≈ 3.14.`, ask:'How many square feet of mat?', ans:A, post:'sq ft', vis:visCircle(`r = ${r} ft`, 'r'),
      guide:[D(`Area = π × r × r. First r × r: ${r} × ${r}`, r*r), D(`Now 3.14 × ${r*r}. Start with 3 × ${r*r}`, 3*r*r), D(`Then 0.14 × ${r*r}`, r2(.14*r*r), {hint:`14 × ${r*r} = ${14*r*r}, then move the decimal point 2 places left.`}), D(`Add them: ${3*r*r} + ${fmt(.14*r*r)}`, A, {post:'sq ft'})]};
  },
  prob(t, ev){
    if (t === 1){ const n = pick([4,5]), m = rnd(60,140); let vals; do { vals = Array.from({length:n-1}, () => m + rnd(-30,30)); vals.push(m*n - vals.reduce((a,b) => a+b, 0)); } while (vals[n-1] < 20 || vals[n-1] > 220);
      const sum = m*n;
      return {scene:`Fans at each race of the ${pick(['spring','summer','fall'])} series: ${vals.join(', ')}.`, ask:'What’s the average (mean) per race?', ans:m, post:'fans', vis:visNights(vals),
        guide:[D(`Add them all up: ${vals.join(' + ')}`, sum, {hint:'Add two at a time, and use the scratch pad.'}), D(`Divide by the number of races: ${sum} ÷ ${n}`, m, {post:'fans'})]}; }
    if (t === 2){ const [w,total] = pick([[5,40],[4,24],[6,30],[3,24],[8,40],[6,48],[4,20],[9,36]]), g = gcd(w,total);
      return {scene:`There are ${total} raffle tickets in the bucket at ${evName(ev)}. ${w} of them win a ride in the pace car.`, ask:'What’s the chance a ticket wins? Write it as a fraction in simplest form.', ans:w/total, frac:true, vis:visRaffle(w,total),
        guide:[D(`Chance = winners ÷ all tickets = ${raw(w,total)}. Simplify: divide the top by ${g}. ${w} ÷ ${g}`, w/g), D(`Divide the bottom by ${g} too: ${total} ÷ ${g}`, total/g), D(`So the chance is`, w/total, {frac:true, hint:`${w/g}/${total/g}`})]}; }
    if (t === 3){ const [a,b] = pick([[3,8],[2,5],[3,4],[5,6],[2,3]]), N = b*rnd(15,40);
      return {scene:`At races like this, about ${raw(a,b)} of the fans buy a team cap. ${N} fans are coming.`, ask:'About how many will buy a cap?', ans:N*a/b, post:'fans', vis:visBar(b, a, `${N} fans`),
        guide:[D(`Find ${raw(1,b)} of ${N}: ${N} ÷ ${b}`, N/b), D(`${raw(a,b)} is ${a} of those: ${a} × ${N/b}`, N*a/b, {post:'fans'})]}; }
    const k1 = pick([3,4,5]), k2 = pick([4,5,6]);
    return {scene:`Your kart gets 1 of ${k1} helmet colors and 1 of ${k2} kart numbers, picked at random.`, ask:'What’s the chance you get one exact pair you want? Write it as a fraction.', ans:1/(k1*k2), frac:true,
      vis:big(`${k1} colors × ${k2} numbers`, 26),
      guide:[D(`How many different pairs are possible? ${k1} × ${k2}`, k1*k2, {post:'pairs'}), D(`Only 1 of those pairs is the one you want. The chance is 1 out of ${k1*k2}`, 1/(k1*k2), {frac:true, hint:`Type 1/${k1*k2}`})]};
  }
};

function seeded(i){ const x = Math.sin(i*99.13)*43758.5453; return x - Math.floor(x); }

const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mixc = (a, b, f) => `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
const fmtTime = s => { s = Math.max(0, s); const m = Math.floor(s/60), r = s - m*60; return `${m}:${r < 10 ? '0' : ''}${r.toFixed(1)}`; };

/* a kart from behind, with shading, spinning tread, brake lights and turning front wheels */
function drawKartBack(c, x, y, w, o = {}){
  const h = w*.62, col = o.col || '#d23b2f', steer = o.steer || 0;
  c.save();
  if (o.ghost) c.globalAlpha = .45;
  c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(x, y, w*.58, w*.08, 0, 0, Math.PI*2); c.fill();
  if (o.glow){ const g = c.createRadialGradient(x, y, 1, x, y, w*.8); g.addColorStop(0,'rgba(80,220,255,.6)'); g.addColorStop(1,'rgba(80,220,255,0)'); c.fillStyle = g; c.beginPath(); c.ellipse(x, y, w*.82, w*.16, 0, 0, Math.PI*2); c.fill(); }
  // front wheels peek out and turn with the steering
  const fw = w*.13, fh = h*.26;
  [-1, 1].forEach(sd => { c.save(); c.translate(x + sd*w*.36 + steer*w*.03, y - h*.62); c.rotate(steer*.25); c.fillStyle = '#16171c'; rr(c, -fw/2, -fh/2, fw, fh, fw*.25); c.fill(); c.restore(); });
  // rear tires with moving tread
  const tw = w*.25, th = h*.52, tread = o.tread || 0;
  [x - w*.52, x + w*.52 - tw].forEach(tx => {
    const g = c.createLinearGradient(tx, 0, tx + tw, 0); g.addColorStop(0,'#0c0d10'); g.addColorStop(.5,'#262830'); g.addColorStop(1,'#0c0d10');
    c.fillStyle = g; rr(c, tx, y - th, tw, th, tw*.24); c.fill();
    c.fillStyle = 'rgba(255,255,255,.07)';
    for (let k=0;k<6;k++){ const yy = y - th + ((k/6 + tread) % 1)*th; c.fillRect(tx + tw*.1, yy, tw*.8, Math.max(1, th*.045)); }
    if (o.slicks){ c.fillStyle = '#e0b21c'; c.fillRect(tx + tw*.44, y - th, tw*.12, th); }
  });
  // frame, bumper, engine
  c.fillStyle = '#2b2e37'; rr(c, x - w*.36, y - h*.36, w*.72, h*.13, h*.05); c.fill();
  c.fillStyle = '#3d424e'; rr(c, x - w*.15, y - h*.54, w*.3, h*.22, h*.05); c.fill();
  // brake lights
  c.fillStyle = o.brake ? '#ff2a2a' : '#5a1414'; [x - w*.27, x + w*.21].forEach(bx => { rr(c, bx, y - h*.33, w*.06, h*.06, h*.02); c.fill(); });
  if (o.brake){ c.fillStyle = 'rgba(255,40,40,.35)'; [x - w*.24, x + w*.24].forEach(bx => { c.beginPath(); c.arc(bx, y - h*.3, w*.08, 0, Math.PI*2); c.fill(); }); }
  // exhaust pipes and flames
  c.fillStyle = o.exhaust ? '#e2e5ec' : '#6b7184';
  c.beginPath(); c.arc(x - w*.09, y - h*.29, w*.036, 0, Math.PI*2); c.arc(x + w*.09, y - h*.29, w*.036, 0, Math.PI*2); c.fill();
  if (o.boost){
    [x - w*.09, x + w*.09].forEach(fx => {
      const f = .75 + Math.random()*.5, r = w*.2*f, g = c.createRadialGradient(fx, y - h*.24, 1, fx, y - h*.24, r);
      g.addColorStop(0,'rgba(255,255,235,1)'); g.addColorStop(.3, o.nitro ? 'rgba(90,210,255,.95)' : 'rgba(255,170,40,.95)'); g.addColorStop(1,'rgba(255,60,10,0)');
      c.fillStyle = g; c.beginPath(); c.arc(fx, y - h*.24, r, 0, Math.PI*2); c.fill();
    });
  }
  // body with shine
  const bg = c.createLinearGradient(0, y - h*.76, 0, y - h*.4); bg.addColorStop(0, col); bg.addColorStop(1, shade(col, -.35));
  c.fillStyle = bg; rr(c, x - w*.32, y - h*.76, w*.64, h*.34, w*.06); c.fill();
  c.fillStyle = 'rgba(255,255,255,.22)'; rr(c, x - w*.29, y - h*.75, w*.58, h*.07, w*.04); c.fill();
  if (o.carbon){ c.fillStyle = 'rgba(0,0,0,.35)'; for (let k=0;k<6;k++) c.fillRect(x - w*.3 + k*w*.1, y - h*.62, w*.05, h*.16); }
  // number plate
  c.fillStyle = '#f6f6f2'; rr(c, x - w*.1, y - h*.69, w*.2, h*.18, w*.03); c.fill();
  c.fillStyle = '#16171c'; c.font = `800 ${Math.max(6, h*.16)}px "Big Shoulders Display",Barlow,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(o.num != null ? o.num : '', x, y - h*.6);
  // wing
  if (o.wing){ c.fillStyle = '#16171c'; c.fillRect(x - w*.21, y - h*1.06, w*.03, h*.34); c.fillRect(x + w*.18, y - h*1.06, w*.03, h*.34); c.fillStyle = col; rr(c, x - w*.42, y - h*1.16, w*.84, h*.12, h*.04); c.fill(); c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(x - w*.42, y - h*1.16, w*.84, h*.03); }
  // driver: shoulders and arms, helmet with visor shine
  c.fillStyle = '#1b1d24'; rr(c, x - w*.17, y - h*.98, w*.34, h*.3, w*.09); c.fill();
  c.strokeStyle = '#1b1d24'; c.lineWidth = w*.06; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x - w*.14, y - h*.86); c.lineTo(x - w*.25 + steer*w*.03, y - h*.74 - steer*h*.04); c.moveTo(x + w*.14, y - h*.86); c.lineTo(x + w*.25 + steer*w*.03, y - h*.74 + steer*h*.04); c.stroke();
  c.fillStyle = col; c.fillRect(x - w*.17, y - h*.87, w*.34, h*.05);
  const hx = x + steer*w*.02, hy = y - h*1.09, hr = w*.135;
  const hg = c.createRadialGradient(hx - hr*.4, hy - hr*.4, hr*.1, hx, hy, hr); hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, o.helmet || '#cfd3db');
  c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, Math.PI*2); c.fill();
  c.fillStyle = col; c.fillRect(hx - hr, hy - hr*.25, hr*2, hr*.36);
  c.restore();
}
function shade(hex, f){ const [r,g,b] = hex2rgb(hex); const k = v => Math.max(0, Math.min(255, Math.round(f < 0 ? v*(1+f) : v + (255-v)*f))); return `rgb(${k(r)},${k(g)},${k(b)})`; }
function rr(c, x, y, w, h, r){ r = Math.max(0, Math.min(r, w/2, h/2)); c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }

/* roadside things, drawn standing on (x, y); k = pixels per world unit */
function drawProp(c, type, x, y, k, T, t){
  const P = u => u*k;
  if (P(2000) < 2) return;
  c.save();
  switch(type){
    case 'tree': {
      c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(x, y, P(600), P(110), 0, 0, Math.PI*2); c.fill();
      c.fillStyle = '#5b3b22'; c.fillRect(x - P(60), y - P(500), P(120), P(500));
      [['#2b6f2e',900,700],['#378636',720,1050],['#47a043',520,1350]].forEach(([col, wd, ht]) => { c.fillStyle = col; c.beginPath(); c.moveTo(x - P(wd/2), y - P(ht - 500)); c.lineTo(x + P(wd/2), y - P(ht - 500)); c.lineTo(x, y - P(ht + 250)); c.fill(); });
      c.fillStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.moveTo(x, y - P(1600)); c.lineTo(x - P(260), y - P(850)); c.lineTo(x, y - P(900)); c.fill();
      break; }
    case 'pine': {
      c.fillStyle = '#4a3322'; c.fillRect(x - P(50), y - P(300), P(100), P(300));
      [[900,300],[700,650],[500,950],[300,1220]].forEach(([wd, by]) => { c.fillStyle = '#2c5a3a'; c.beginPath(); c.moveTo(x - P(wd/2), y - P(by)); c.lineTo(x + P(wd/2), y - P(by)); c.lineTo(x, y - P(by + 520)); c.fill(); c.fillStyle = '#f4f8fc'; c.beginPath(); c.moveTo(x - P(wd/5), y - P(by + 300)); c.lineTo(x + P(wd/5), y - P(by + 300)); c.lineTo(x, y - P(by + 520)); c.fill(); });
      break; }
    case 'cactus': {
      c.fillStyle = '#3f8a4a'; rr(c, x - P(90), y - P(1000), P(180), P(1000), P(90)); c.fill();
      rr(c, x - P(330), y - P(700), P(140), P(380), P(70)); c.fill(); c.fillRect(x - P(260), y - P(420), P(200), P(120));
      rr(c, x + P(190), y - P(820), P(140), P(420), P(70)); c.fill(); c.fillRect(x + P(60), y - P(520), P(200), P(120));
      break; }
    case 'rock': {
      c.fillStyle = T.id === 'snow' ? '#8d98a6' : T.id === 'canyon' ? '#7a2e14' : '#9b7b55';
      c.beginPath(); c.moveTo(x - P(600), y); c.lineTo(x - P(450), y - P(500)); c.lineTo(x - P(80), y - P(760)); c.lineTo(x + P(380), y - P(520)); c.lineTo(x + P(620), y); c.fill();
      c.fillStyle = 'rgba(255,255,255,.14)'; c.beginPath(); c.moveTo(x - P(450), y - P(500)); c.lineTo(x - P(80), y - P(760)); c.lineTo(x - P(120), y - P(300)); c.fill();
      break; }
    case 'tires': {
      for (let r=0;r<3;r++) for (let q=0;q<3-r;q++){ const cx = x - P(260) + q*P(260) + r*P(130), cy = y - P(120) - r*P(220); c.fillStyle = '#16171c'; c.beginPath(); c.ellipse(cx, cy, P(130), P(110), 0, 0, Math.PI*2); c.fill(); c.fillStyle = (r+q)%2 ? '#d23b2f' : '#f2f2f2'; c.beginPath(); c.ellipse(cx, cy, P(70), P(55), 0, 0, Math.PI*2); c.fill(); c.fillStyle = '#16171c'; c.beginPath(); c.ellipse(cx, cy, P(40), P(30), 0, 0, Math.PI*2); c.fill(); }
      break; }
    case 'cone': {
      c.fillStyle = '#f08a1c'; c.beginPath(); c.moveTo(x - P(110), y); c.lineTo(x + P(110), y); c.lineTo(x, y - P(320)); c.fill(); c.fillStyle = '#fff'; c.fillRect(x - P(62), y - P(170), P(124), P(45));
      break; }
    case 'bill': {
      c.fillStyle = '#2b2e37'; c.fillRect(x - P(520), y - P(700), P(70), P(700)); c.fillRect(x + P(450), y - P(700), P(70), P(700));
      c.fillStyle = '#16171c'; c.fillRect(x - P(700), y - P(1300), P(1400), P(640));
      const g = c.createLinearGradient(0, y - P(1260), 0, y - P(700)); g.addColorStop(0, '#ffcf3a'); g.addColorStop(1, '#e0a51c');
      c.fillStyle = g; c.fillRect(x - P(660), y - P(1260), P(1320), P(560));
      c.fillStyle = '#16171c'; c.font = `800 ${P(380)}px "Big Shoulders Display",Impact,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('APEX', x, y - P(980));
      if (T.night){ c.fillStyle = 'rgba(255,230,150,.2)'; c.fillRect(x - P(760), y - P(1340), P(1520), P(720)); }
      break; }
    case 'lamp': {
      c.fillStyle = '#4a5063'; c.fillRect(x - P(40), y - P(1800), P(80), P(1800)); c.fillRect(x - P(40), y - P(1800), P(420), P(60));
      const g = c.createRadialGradient(x + P(360), y - P(1740), 1, x + P(360), y - P(1740), P(800)); g.addColorStop(0,'rgba(255,220,140,.8)'); g.addColorStop(1,'rgba(255,220,140,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x + P(360), y - P(1740), P(800), 0, Math.PI*2); c.fill();
      c.fillStyle = '#fff4cf'; c.beginPath(); c.ellipse(x + P(360), y - P(1735), P(90), P(40), 0, 0, Math.PI*2); c.fill();
      break; }
    case 'stand': {
      c.fillStyle = '#3a3f4f'; c.fillRect(x - P(1200), y - P(900), P(2400), P(900));
      c.fillStyle = '#d23b2f'; c.fillRect(x - P(1260), y - P(1020), P(2520), P(140));
      c.fillStyle = '#2b2f3b'; c.fillRect(x - P(1300), y - P(1100), P(2600), P(90));
      for (let r=0;r<4;r++) for (let q=0;q<14;q++){ const cx = x - P(1120) + q*P(172), cy = y - P(780) + r*P(190) + Math.sin(t*9 + q + r*3)*P(18); c.fillStyle = ['#f0b44c','#6cc7d9','#f4f4f0','#e07a5f','#86d394'][(q*7 + r*3) % 5]; c.beginPath(); c.arc(cx, cy, P(52), 0, Math.PI*2); c.fill(); }
      break; }
    case 'flag': {
      c.fillStyle = '#9aa0b3'; c.fillRect(x - P(25), y - P(1500), P(50), P(1500));
      const fw = P(700), fh = P(440), wave = Math.sin(t*6)*P(40);
      for (let r=0;r<4;r++) for (let q=0;q<6;q++){ c.fillStyle = (r+q)%2 ? '#111' : '#fff'; c.fillRect(x + q*fw/6, y - P(1500) + r*fh/4 + wave*q/6, fw/6 + 1, fh/4 + 1); }
      break; }
    case 'gantry': {
      // start/finish bridge across the whole road (x is the road centre, k at that depth)
      const half = P(1400*1.45);

    g += `<circle cx="0" cy="8" r="15" fill="#f4f4f0"/><rect x="-15" y="4" width="30" height="7" fill="#1d2433"/>`;
    if (state === 'done') g += `<path class="arm" d="M14 28l18-26" stroke="${col}" stroke-width="9" stroke-linecap="round"/><circle cx="33" cy="-1" r="6" fill="#f4f4f0"/>`;

    if (tool === 'gun' && state !== 'done') g += `<g class="tool"><rect x="34" y="34" width="26" height="12" rx="3" fill="#9aa0b3"/><rect x="58" y="37" width="10" height="6" fill="#4a5063"/></g>`;
    if (tool === 'fuel' && state !== 'done') g += `<g class="tool"><path d="M40 42c20 0 30-10 40-24" stroke="#2b2e37" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="30" y="36" width="16" height="14" rx="3" fill="#e0b21c"/></g>`;
    if (tool === 'nitro' && state !== 'done') g += `<g class="tool"><rect x="36" y="22" width="16" height="36" rx="7" fill="#2f6fd6"/><rect x="36" y="32" width="16" height="6" fill="#c9ccd5"/></g>`;
    return g + `</g>`;
  };
  let s = `<svg viewBox="0 0 800 420" role="img" aria-label="Pit stop">${svgDefs('t')}`;
  s += `<rect width="800" height="420" fill="#141a2a"/>`;
  for (let y=16;y<230;y+=18) s += `<path d="M0 ${y}H800" stroke="#1c2336" stroke-width="2"/>`;
  s += `<rect x="40" y="26" width="300" height="56" rx="6" fill="#0e121d" stroke="${col}" stroke-width="3"/><text x="190" y="64" text-anchor="middle" font-family="'Big Shoulders Display',Impact,sans-serif" font-weight="800" font-size="30" fill="#f4f1e8" letter-spacing="2">${qual ? 'QUALIFYING' : `PIT STOP ${stop.no}`}</text>`;
  // job board
  s += `<rect x="470" y="22" width="300" height="${24 + q*34}" rx="8" fill="#0e121d" stroke="#2e3548" stroke-width="2"/>`;
  for (let k=0;k<q;k++){ const ok = k < done, cur = k === done; s += `<g transform="translate(486 ${48 + k*34})"><circle r="11" cx="10" cy="0" fill="${ok ? '#4ade80' : cur ? '#ffb627' : '#2e3548'}"/><text x="10" y="5" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="800" font-size="13" fill="#0e111a">${ok ? '✓' : k + 1}</text><text x="32" y="6" font-family="Barlow,sans-serif" font-weight="700" font-size="18" fill="${ok ? '#9ba3b9' : '#eef0f5'}">${jobs[k]}${cur ? '  ← solve it' : ''}</text></g>`; }
  // floor
  s += `<path d="M0 230H800V420H0z" fill="#2a2f3b"/><path d="M0 230H800" stroke="#ffb627" stroke-width="4" stroke-dasharray="26 18"/>`;
  s += `<rect x="150" y="372" width="500" height="10" fill="#ffb627" opacity=".5"/>`;
  s += `<polygon points="330,0 470,0 640,420 160,420" fill="url(#tspot)"/>`;
  // jack under the kart
  s += `<rect x="520" y="352" width="120" height="14" rx="4" fill="#d23b2f"/><path d="M560 352l20-30h20" stroke="#9aa0b3" stroke-width="8" fill="none"/>`;
  const job = k => Math.min(k, q - 1), states = k => job(k) < done ? 'done' : job(k) === done ? 'work' : 'wait';
  s += crew(430, 176, true, states(2), qual ? 'gun' : 'nitro');
  s += kartSide(L, 70, 34 - (done > 0 ? 8 : 0), .95, 't');
  s += `<g transform="translate(400 330) scale(1.25) translate(-400 -330)">`;
  s += crew(150, 262, false, states(0), 'gun');
  s += crew(668, 262, true, states(1), qual ? 'gun' : 'fuel');
  s += `</g>`;
  if (done >= q) s += `<text x="400" y="404" text-anchor="middle" font-family="'Big Shoulders Display',Impact,sans-serif" font-weight="800" font-size="30" fill="#4ade80">ALL DONE: GO!</text>`;
  return s + `</svg>`;
}

/* ===== effects layer: coins, sparks, confetti, light sweeps ===== */
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX = (() => {
  let cv, ctx, dpr = 1, parts = [], raf = 0;
  const COLS = ['#f0b44c','#6cc7d9','#ff8a4c','#86d394','#fff8ea','#e07a5f'];
  function size(){ if (!cv) return; dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }
  function init(){ cv = $('#fx'); if (!cv) return; ctx = cv.getContext('2d'); size(); addEventListener('resize', size); }
  function loop(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
    parts = parts.filter(p => p.step(ctx));
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
  }
  const add = p => { if (!ctx) return; parts.push(p); if (!raf) raf = requestAnimationFrame(loop); };
  const center = el => { const r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; };
  function coin(ctx, x, y, s, spin){
    const w = Math.max(2, Math.abs(Math.cos(spin))*s);
    ctx.save(); ctx.translate(x, y);
    const g = ctx.createRadialGradient(-s*.3,-s*.3,1,0,0,s); g.addColorStop(0,'#fff1c4'); g.addColorStop(.45,'#f0b44c'); g.addColorStop(1,'#a76a08');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,w,s,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,0,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
    if (w > s*.5){ ctx.fillStyle = 'rgba(110,62,0,.8)'; ctx.font = `700 ${s*1.2}px Barlow,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, 1); }
    ctx.restore();
  }
  return {
    init,
    // coins fly from one element to another along a curve; onArrive fires once, when the last lands
    coins(fromEl, toEl, n, onArrive){
      if (reduceMotion() || !fromEl || !toEl || !ctx){ onArrive && onArrive(); return; }
      const a = center(fromEl), b = center(toEl); let left = n;
      for (let i=0;i<n;i++){
        const sx = a.x + (Math.random()-.5)*120, sy = a.y + (Math.random()-.5)*50;
        const cx = (sx + b.x)/2 + (Math.random()-.5)*260, cy = Math.min(sy, b.y) - 120 - Math.random()*140;
        const delay = i*55, dur = 700 + Math.random()*250, t0 = performance.now() + delay, s = 8 + Math.random()*4, sp = Math.random()*6;
        add({step(c){
          const t = (performance.now() - t0)/dur; if (t < 0) return true;
          const k = Math.min(1, t), e = k*k*(3-2*k), u = 1-e;
          const x = u*u*sx + 2*u*e*cx + e*e*b.x, y = u*u*sy + 2*u*e*cy + e*e*b.y;
          coin(c, x, y, s*(1 - .35*e), sp + k*14);
          if (k >= 1){ if (--left === 0 && onArrive) onArrive(); return false; }
          return true;
        }});
      }
    },
    // glowing burst of sparks around a point or element
    burst(at, n = 26, cols = COLS){
      if (reduceMotion() || !ctx) return;
      const p0 = at.nodeType ? center(at) : at;
      for (let i=0;i<n;i++){
        const ang = Math.random()*Math.PI*2, v = 2 + Math.random()*5, col = cols[i % cols.length];
        let x = p0.x, y = p0.y, vx = Math.cos(ang)*v, vy = Math.sin(ang)*v, life = 1;
        add({step(c){
          x += vx; y += vy; vx *= .94; vy = vy*.94 + .08; life -= .022;
          if (life <= 0) return false;
          c.globalCompositeOperation = 'lighter'; c.globalAlpha = life;
          c.fillStyle = col; c.beginPath(); c.arc(x, y, 2.6*life + .8, 0, Math.PI*2); c.fill();
          c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; return true;
        }});
      }
    },
    // confetti from the top of the screen
    confetti(n = 90){
      if (reduceMotion() || !ctx) return;
      for (let i=0;i<n;i++){
        let x = Math.random()*innerWidth, y = -20 - Math.random()*innerHeight*.5, vx = (Math.random()-.5)*2.4, vy = 2 + Math.random()*3;
        let r = Math.random()*6, vr = (Math.random()-.5)*.3, w = 6 + Math.random()*6, h = 3 + Math.random()*5, col = COLS[i % COLS.length], sw = Math.random()*6;
        add({step(c){
          x += vx + Math.sin((y + sw*40)/40)*.8; y += vy; r += vr;
          if (y > innerHeight + 20) return false;
          c.save(); c.translate(x, y); c.rotate(r); c.scale(1, Math.cos(r*2)); c.fillStyle = col; c.fillRect(-w/2,-h/2,w,h); c.restore(); return true;
        }});
      }
    },
    // stage lights sweeping across the whole screen
    lights(ms = 1900){
      if (reduceMotion() || !ctx) return;
      const t0 = performance.now(), cols = ['240,180,76','108,199,217','255,138,76','134,211,148'];
      add({step(c){
        const t = (performance.now() - t0)/ms; if (t >= 1) return false;
        const fade = Math.sin(Math.PI*t), W = innerWidth, H = innerHeight;
        c.globalCompositeOperation = 'lighter';
        cols.forEach((col, i) => {
          const ox = W*(i+.5)/cols.length, ang = Math.sin(t*Math.PI*2 + i*1.7)*.55, len = H*1.3;
          const tx = ox + Math.sin(ang)*len, ty = Math.cos(ang)*len, spread = 140;
          const g = c.createLinearGradient(ox, 0, tx, ty); g.addColorStop(0, `rgba(${col},${.26*fade})`); g.addColorStop(1, `rgba(${col},0)`);
          c.fillStyle = g; c.beginPath(); c.moveTo(ox-6, -4); c.lineTo(ox+6, -4);
          c.lineTo(tx + Math.cos(ang)*spread, ty - Math.sin(ang)*spread); c.lineTo(tx - Math.cos(ang)*spread, ty + Math.sin(ang)*spread); c.closePath(); c.fill();
        });
        c.globalCompositeOperation = 'source-over'; return true;
      }});
    }
  };
})();

function floatAt(el, text, color){
  const r = (el || document.body).getBoundingClientRect(), f = document.createElement('div');
  f.className = 'float'; f.textContent = text; if (color) f.style.color = color;
  f.style.left = (r.left + r.width/2) + 'px'; f.style.top = (r.top - 6) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1400);
}
let bannerT;
function banner(big, small){
  const b = $('#banner'); b.innerHTML = `<b>${big}</b><span>${small || ''}</span>`;
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('on'), 2100);
}
function toast(t){ const el = $('#toast'); el.innerHTML = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); }
function addCash(n){ S.cash = r2(S.cash + n); if (S.shift) S.shift.earned = r2(S.shift.earned + n); }
function addXP(n){
  S.xp += n; if (S.shift) S.shift.xp += n;
  while (S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level); S.level++;
    setTimeout(() => { banner(`Level ${S.level}`, 'Your team is growing' + (TRACKS.find(t => t.lvl === S.level) ? `. New track: ${TRACKS.find(t => t.lvl === S.level).name}!` : '')); FX.lights(2200); FX.confetti(120); }, 900);
    if (S.shift) S.shift.levels.push(S.level);
    if (S.level >= 5) award('lvl5'); if (S.level >= 10) award('lvl10');
  }
  header();
}
function award(id){
  if (S.badges[id]) return; S.badges[id] = Date.now();
  const b = BADGES.find(x => x.id === id); addCash(25);
  setTimeout(() => { toast(`Trophy earned: <b>${b.name}</b> (+$25)`); FX.burst({x:innerWidth/2, y:innerHeight-40}, 30); }, 1500);
}
function playDay(){
  const t = todayStr(), d = S.days;
  if (d.last === t) return;
  let next = 1;
  if (d.last){
    const a = new Date(d.last + 'T12:00'), b = new Date(t + 'T12:00'), gap = Math.round((b - a)/864e5);
    const skipsShabbos = gap === 2 && new Date(a.getTime() + 864e5).getDay() === 6;
    if (gap === 1 || skipsShabbos) next = d.streak + 1;
  }
  d.last = t; d.streak = next;
  if (next >= 2){ const bonus = Math.min(100, next*10); addCash(bonus); setTimeout(() => { banner(`${next} days in a row`, `Day bonus: +$${bonus}`); FX.burst($('#banner'), 40); }, 400); }
  if (next >= 3) award('days3');
}
function ensureMissions(){
  const t = todayStr();
  if (S.missions && S.missions.date === t) return;
  const pool = [...MISSION_POOL].sort(() => Math.random() - .5).slice(0,3);
  S.missions = {date:t, chest:false, list:pool.map(m => ({id:m.id, prog:0, done:false}))};
}
function mission(ev, val = 1){
  ensureMissions();
  S.missions.list.forEach(m => {
    const def = MISSION_POOL.find(x => x.id === m.id); if (m.done || def.ev !== ev) return;
    m.prog = ev === 'combo' || ev === 'coins' ? Math.max(m.prog, val) : m.prog + val;
    if (m.prog >= def.goal){ m.done = true; addCash(50); addXP(20); setTimeout(() => toast(`Mission complete: <b>${def.text}</b> (+$50)`), 700); }
  });
  if (!S.missions.chest && S.missions.list.every(m => m.done)){ S.missions.chest = true; addCash(100); setTimeout(() => { banner('Daily chest', 'All 3 missions done: +$100'); FX.confetti(110); }, 1800); }
}

let shownCash = null, cashHold = false;
function tweenCash(to){
  const el = $('#cash'); if (!el) return;
  if (shownCash === null || reduceMotion() || shownCash === to){ shownCash = to; el.textContent = money(to); return; }
  const from = shownCash, t0 = performance.now(), dur = 700; shownCash = to;
  const f = t => { if (shownCash !== to) return; const k = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-k, 3); el.textContent = money(Math.round(from + (to-from)*e)); if (k < 1) requestAnimationFrame(f); else el.textContent = money(to); };
  requestAnimationFrame(f);
}
function bumpEl(el){ if (!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function countUp(el, to){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = money(to); return; }
  const t0 = performance.now(), dur = 1200;
  const f = t => { const k = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-k, 3); el.textContent = money(Math.round(to*e)); if (k < 1) requestAnimationFrame(f); else el.textContent = money(to); };

}

function vGo(i){

/* ===== read aloud ===== */
/* Picks the most natural MAN's voice this computer has. Women's voices are never used. */
const MALE = /\b(male|man|guy|andrew|brian|christopher|eric|roger|steffan|davis|tony|jason|daniel|alex|aaron|fred|tom|arthur|gordon|rishi|oliver|evan|nathan|reed|rocko|thomas|david|mark|james|george|ryan|william|liam|ethan|noah|jacob|connor|mitchell|lee|neil|ralph|albert|bruce|junior|grandpa|eddy)\b/i;
const FEMALE = /\b(female|woman|samantha|victoria|karen|moira|tessa|fiona|zira|susan|hazel|jenny|aria|sonia|libby|ava|allison|emma|serena|kate|catherine|veena|joanna|salli|kimberly|ivy|amy|olivia|natasha|clara|michelle|ana|zoe|nicky|shelley|sandy|grandma|flo|martha|kathy|princess|vicki|agnes|ellen|nora|sara|kendra|emily|jessa|monica|paulina|anna|ellie|elsa|heera)\b/i;
let VOICE = null;
function voiceList(){
  if (!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang) && !FEMALE.test(v.name) && (MALE.test(v.name)))
    .map(v => ({v, score:(/natural|neural|online|enhanced|premium|siri/i.test(v.name) ? 20 : 0) + (/en[-_]US/i.test(v.lang) ? 4 : /en[-_]GB/i.test(v.lang) ? 3 : 1) + (/google/i.test(v.name) ? 2 : 0)}))
    .sort((a, b) => b.score - a.score).map(x => x.v);
}
function pickVoice(){
  const list = voiceList(); if (!list.length){ VOICE = null; return; }
  const want = S && S.voice;
  VOICE = (want && list.find(v => v.name === want)) || list[0];
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// turn math symbols and money into the words a person would say
function sayable(t){
  return t.replace(/\$(\d[\d,]*)\.(\d\d)\b/g, (m, d, c) => `${d} dollars${+c ? ` and ${+c} cents` : ''}`)
    .replace(/\$(\d[\d,]*)/g, '$1 dollars').replace(/(\d)¢/g, '$1 cents').replace(/(\d)%/g, '$1 percent')
    .replace(/−/g, ' minus ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ')
    .replace(/\bR (\d)/g, 'remainder $1').replace(/\s+/g, ' ').trim();
}
let speakQ = [];
function speakEls(els, done){
  if (!('speechSynthesis' in window)){ toast('Reading aloud isn’t available on this computer.'); return; }
  stopSpeak(); if (!VOICE) pickVoice();
  if (!VOICE){ toast('This computer doesn’t have a man’s voice installed for reading aloud. Ask your teacher.'); if (done) done(); return; }
  const text = sayable(els.filter(Boolean).map(el => { const c = el.cloneNode(true); c.querySelectorAll('.fr').forEach(f => f.replaceWith(` ${f.children[0].textContent} over ${f.children[1].textContent} `)); return c.textContent; }).join('. '));
  // short sentence by sentence reads more like a person (and avoids Chrome cutting off long text)
  speakQ = text.match(/[^.!?]+[.!?]*/g) || [text];
  const next = () => {
    if (!speakQ.length){ if (done) done(); return; }
    const u = new SpeechSynthesisUtterance(speakQ.shift().trim());
    u.voice = VOICE; u.lang = VOICE.lang; u.rate = /natural|neural|online/i.test(VOICE.name) ? 1 : .93; u.pitch = 1;
    u.onend = () => setTimeout(next, 180); u.onerror = () => { speakQ = []; };
    speechSynthesis.speak(u);
  };
  next();
}
function stopSpeak(){ speakQ = []; try{ speechSynthesis.cancel(); }catch(e){} }

/* ===== scratch pad ===== */
const pad = {erase:false, drawing:false, last:null, ctx:null};
function openPad(){
  const p = $('#pad'); p.hidden = false; sizePad(); mission('pad');
}
function closePad(){ $('#pad').hidden = true; }
function clearPad(){ const c = $('#padC'); if (pad.ctx) pad.ctx.clearRect(0,0,c.width,c.height); }
function sizePad(){
  const c = $('#padC'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width === Math.round(r.width*dpr) && c.height === Math.round(r.height*dpr)) return;
  const old = pad.ctx ? c.toDataURL() : null;
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  pad.ctx = c.getContext('2d'); pad.ctx.scale(dpr,dpr); pad.ctx.lineCap = 'round'; pad.ctx.lineJoin = 'round';
  if (old){ const im = new Image(); im.onload = () => pad.ctx.drawImage(im,0,0,r.width,r.height); im.src = old; }
}
(function initPad(){
  const c = $('#padC');
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => { sizePad(); pad.drawing = true; pad.last = pos(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => {
    if (!pad.drawing) return; const p = pos(e), x = pad.ctx;
    x.globalCompositeOperation = pad.erase ? 'destination-out' : 'source-over';
    x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text'); x.lineWidth = pad.erase ? 22 : 3;
    x.beginPath(); x.moveTo(...pad.last); x.lineTo(...p); x.stroke(); pad.last = p;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => c.addEventListener(ev, () => pad.drawing = false));
  $('#pPen').onclick = () => { pad.erase = false; $('#pPen').setAttribute('aria-pressed','true'); $('#pErase').setAttribute('aria-pressed','false'); };
  $('#pErase').onclick = () => { pad.erase = true; $('#pErase').setAttribute('aria-pressed','true'); $('#pPen').setAttribute('aria-pressed','false'); };
  $('#pClear').onclick = clearPad;
  $('#pClose').onclick = closePad;
})();

            <td>${sel('assist', [['true','On: kart speeds up by itself'],['false','Off: he works the gas']])}</td><td>${sel('coin', [['true','On'],['false','Off']])}</td>
            <td class="n"><b data-share="${esc(st.id)}">${mathShare(c)}%</b></td><td><button class="btn" data-cfgsave="${esc(st.id)}" style="padding:5px 12px;font-size:14px">Save</button></td></tr>`; }).join('') || '<tr><td colspan="8">No students yet.</td></tr>'}</table>
        <p class="small" style="margin:8px 0 0">Math share is an estimate of time spent on challenges versus driving. A good start is about half (1 challenge per pit stop, medium laps). When he’s ready for more, try 2 per pit stop.</p>`}</div>
      <div class="tcard"><b>Activity log</b>
        <table class="tbl tlog" style="margin-top:6px"><tr><th>When</th><th>Student</th><th>What happened</th></tr>
        ${res.log.map(l => `<tr><td style="white-space:nowrap">${fmtWhen(l.at)}</td><td>${esc(l.name || '')}</td><td>${esc(l.detail || l.event)}</td></tr>`).join('') || '<tr><td colspan="3" class="small">Nothing yet.</td></tr>'}</table></div>
    </div></div>`;
  $('#lkOn').onchange = () => { $('#lkState').textContent = $('#lkOn').checked ? 'Daily lock on' : 'Daily lock off'; };
  $('#lkSave').onclick = async () => {
    const r = await rpc('stage_admin_set_settings', {p_pass:TPASS, p_lock_on:$('#lkOn').checked, p_close:$('#lkClose').value, p_open:$('#lkOpen').value});
    if (r.ok){ await fetchLock(); $('#lkNow').textContent = isClosed() ? 'Closed right now' : 'Open right now'; toast(LOCK.on ? `Saved. Closes at ${fmtT12(LOCK.close)}, reopens at ${fmtT12(LOCK.open)}.` : 'Saved. The daily lock is off.'); }
    else toast(r.error === 'time' ? 'Check the times and try again.' : 'Couldn’t save. Check the password.');
  };
  const readCfg = sid => { const c = {}; $$(`[data-cf][data-sid="${sid}"]`).forEach(el => { const v = el.value; c[el.dataset.cf] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; }); return c; };
  $$('[data-cf]').forEach(el => el.onchange = () => { const sid = el.dataset.sid, b = $(`[data-share="${sid}"]`); if (b) b.textContent = mathShare({...CFG_DEFAULT, ...readCfg(sid)}) + '%'; });
  $$('[data-cfgsave]').forEach(b => b.onclick = async () => {
    const sid = b.dataset.cfgsave, c = readCfg(sid);
    try{ const r = await rpc('stage_admin_set_cfg', {p_pass:TPASS, p_student:sid, p_cfg:c}); toast(r.ok ? 'Saved. It takes effect the next time he signs in.' : 'Couldn’t save. Check the password.'); }
    catch(e){ toast('Couldn’t reach the school server.'); }
  });
  $('#tRefresh').onclick = loadTeacher;
  $('#tClose').onclick = () => { TPASS = ''; showGate(); };
  $$('[data-reset]').forEach(b => b.onclick = async () => {
    if (!confirm(`Erase ${b.dataset.name}’s Apex Karts team and progress? He’ll start over from the beginning.`)) return;
    const r = await rpc('stage_admin_reset', {p_pass:TPASS, p_student:b.dataset.reset}); toast(r.ok ? 'Progress erased.' : 'Couldn’t reset.'); loadTeacher();
  });
}

// Fills in anything missing or out of date in a saved company, so older saves always open.
// deep = true also clears today's missions and an unfinished shift (used only if HQ failed to draw).
function repairState(deep){
  const base = newState(S.company || 'Clear Sound Productions');
  const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
  for (const k in base) if (!['v','math7','found','kart'].includes(k)) if (S[k] === undefined || S[k] === null && base[k] !== null) S[k] = base[k];
  if (typeof S.company !== 'string' || !S.company.trim()) S.company = base.company;
  ['cash','xp'].forEach(k => { if (typeof S[k] !== 'number' || !isFinite(S[k])) S[k] = base[k]; });
  if (!Number.isInteger(S.level) || S.level < 1) S.level = 1;
  ['gear','skills','open','badges'].forEach(k => { if (!isObj(S[k])) S[k] = base[k]; });
  if (!isObj(S.stats)) S.stats = base.stats; for (const k in base.stats) if (typeof S.stats[k] !== 'number') S.stats[k] = 0;
  if (!isObj(S.days)) S.days = base.days; if (typeof S.days.streak !== 'number') S.days.streak = 0;
  if (!isObj(S.seen)) S.seen = base.seen; if (!isObj(S.seen.lessons)) S.seen.lessons = {};
  SKILLS.forEach(x => { const k = S.skills[x.id]; if (!isObj(k)) S.skills[x.id] = {m:0, ease:0}; else { if (typeof k.m !== 'number' || !isFinite(k.m)) k.m = 0; if (typeof k.ease !== 'number') k.ease = 0; if (k.rec && !Array.isArray(k.rec)) delete k.rec; } });
  if (!PACES[S.pace]) S.pace = 'steady';
  S.history = Array.isArray(S.history) ? S.history.filter(h => h && typeof h.earned === 'number' && isFinite(h.earned)) : [];
  const m = S.missions;
  if (m && (!Array.isArray(m.list) || m.list.some(x => !x || !MISSION_POOL.find(d => d.id === x.id)))) S.missions = null;
  const sh = S.shift;
  if (sh && (!isObj(sh.ev) || !Array.isArray(sh.list) || !sh.list[sh.i] || !SK(sh.list[sh.i].skill) || !isObj(sh.cur) || !PACES[S.pace] || !sh.laps || (sh.phase === 'pit' && !isObj(sh.stop)))) S.shift = null;
  if (deep){ S.missions = null; S.shift = null; }
  S.act = isObj(S.act) ? S.act : {};
}

function startGame(state){
  document.body.dataset.mode = 'app'; shownCash = null;
  S = state && state.v === 3 && state.skills ? state : null;
  if (S){
    repairState(false);
    if (!S.math7){ const sk = {}; SKILLS.forEach(x => sk[x.id] = {m:0, ease:0}); S.skills = sk; S.seen.lessons = {}; S.shift = null; S.math7 = true; }
    if (!S.found){ ['div','frb','dec'].forEach(id => { if (!S.skills[id]) S.skills[id] = {m:0, ease:0}; delete S.seen.lessons[id]; }); S.open = {div:true}; S.shift = null; S.found = true; }
    SKILLS.forEach(x => { if (!S.skills[x.id]) S.skills[x.id] = {m:0, ease:0}; });
    if (!S.kart){
      // Encore's stage gear becomes kart parts of the exact same price, so nothing he earned is lost
      const g = {}; GEAR.forEach(p => { if (S.gear[p.old] || S.gear[p.id]) g[p.id] = true; }); S.gear = g;
      S.paint = S.paint || {c:'#d23b2f', num:7}; S.track = 'river'; S.shift = null; S.kart = true;
      report('fix', {msg:'moved to the go-kart version, skills, stars, cash and parts kept'});
      setTimeout(() => showModal(`<div class="stage">${garageSVG()}</div><h2 class="disp">Welcome to Apex Karts</h2>
        <p>Your team <b>${esc(S.company)}</b> is now a go-kart racing team. Everything you earned came with you: your level, your skills and stars, your cash${Object.keys(S.gear).length ? ', and your gear, which is now real kart parts' : ''}.</p>
        <p>Pick a track and start a race. Every challenge you solve is a boost past the other karts. Change your kart’s color and number in the paint shop.</p>
        <div class="acts"><button class="btn big" id="bKGo">Let’s race</button></div>`) || ($('#bKGo').onclick = closeModal), 400);
    }
    if (!S.paint) S.paint = {c:'#d23b2f', num:7};
    if (!S.track) S.track = 'river';
    if (S.shift && (!S.shift.laps || !S.shift.phase)) S.shift = null;
    S.act = S.act || {};
    header(); renderHub(); save();
  } else { $('#view').innerHTML = `<div class="stage">${garageSVG({look:{col:'#d23b2f', num:7}, team:''})}</div>`; welcome(); }
}
FX.init();
(async () => {
  await Promise.race([fetchLock(), new Promise(r => setTimeout(r, 3000))]);
  if (DEMO){ NAME = 'Demo'; startGame(null); toast('Demo mode: nothing is saved.'); return; }
  showGate();
})();

</script>
