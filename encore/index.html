<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebe7de; --panel:#fbf9f4; --panel2:#f1ede3; --line:#d8d1c1;
  --text:#1f2230; --muted:#5d6276; --amber:#a76a08; --amber-ink:#fff8ea; --amber-soft:#f6e5c2;
  --cyan:#1d7b8f; --good:#2c7a3c; --bad:#b3432f; --good-soft:#dff0e1; --bad-soft:#f8e2dc; --flame:#d9541e;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161a26; --panel:#1f2434; --panel2:#283044; --line:#363e56;
    --text:#ece7da; --muted:#9ca2b6; --amber:#f0b44c; --amber-ink:#1d1606; --amber-soft:#3a3120;
    --cyan:#6cc7d9; --good:#86d394; --bad:#f08f7e; --good-soft:#1f3a2a; --bad-soft:#40251f; --flame:#ff8a4c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161a26; --panel:#1f2434; --panel2:#283044; --line:#363e56;
  --text:#ece7da; --muted:#9ca2b6; --amber:#f0b44c; --amber-ink:#1d1606; --amber-soft:#3a3120;
  --cyan:#6cc7d9; --good:#86d394; --bad:#f08f7e; --good-soft:#1f3a2a; --bad-soft:#40251f; --flame:#ff8a4c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:"Big Shoulders Display","Barlow",Impact,sans-serif;font-weight:800;letter-spacing:.01em;line-height:1}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.72em;line-height:1.08;text-align:center;margin:0 1px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}

.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 18px;max-width:1160px;margin:0 auto}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:12px}
.brand b{font-size:32px}
.brand span{color:var(--muted);font-size:15px}
.stat{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 8px}
.stat svg{flex:none}
.stat strong{font-size:19px;font-weight:700}
.stat .xp{display:flex;flex-direction:column;gap:3px;min-width:90px}
.stat .xp small{font-size:12px;color:var(--muted);line-height:1}
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:4px;transition:width .6s ease}
.bar.good i{background:var(--good)}
.menu{display:flex;gap:6px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:14px;color:var(--muted)}
.ghost:hover{color:var(--text);border-color:var(--muted)}
main{max-width:1160px;margin:0 auto;padding:0 18px 60px}
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:10px;padding:11px 20px;font-weight:700;font-size:17px}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:20px;padding:14px 26px}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--amber)}
.btn.good{background:var(--good);color:var(--panel)}

/* stage */
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0f1220;line-height:0}
.stage svg{width:100%;height:auto;display:block}
.beam,.spotb{opacity:0;transition:opacity .8s ease}
.idle .beam{opacity:.35}
.show .beam,.show .spotb{opacity:1}
.ledcell{opacity:.25}
.show .ledcell,.idle .ledcell{opacity:.85}
.show .crowd g{animation:bob .55s ease-in-out infinite alternate}
.show .ledcell{animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes pulse{from{opacity:.35}to{opacity:1}}

/* hub */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{margin:0 0 6px;font-size:30px}
.card p{margin:0 0 8px}
.muted{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 6px;text-align:center;line-height:1.2}
.seg button b{display:block;font-size:15px}
.seg button small{color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber);background:var(--amber-soft)}
.missions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mis{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:15px}
.mis .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.mis.done .ck{background:var(--good);border-color:var(--good);color:var(--panel)}
.mis.done span{color:var(--muted);text-decoration:line-through}
.mis small{color:var(--muted)}
h3.sec{font-family:"Big Shoulders Display","Barlow",sans-serif;font-weight:800;font-size:28px;margin:32px 0 12px}
.prog3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.bigl{display:flex;align-items:center;gap:16px}
.bigl .ring{width:84px;height:84px;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:24px}
.stats small{color:var(--muted);font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.skill.lock{opacity:.55}
.skill .hd{display:flex;align-items:center;gap:10px}
.skill .ic{width:44px;height:44px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none}
.skill b{font-size:17px;line-height:1.2}
.skill small{color:var(--muted);font-size:13.5px}
.stars{color:var(--amber);letter-spacing:2px;font-size:18px}
.stars .off{color:var(--line)}
.skill .acts{display:flex;gap:8px;margin-top:4px}
.skill .acts .btn{font-size:14.5px;padding:8px 12px;flex:1}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tro b{font-size:14.5px;line-height:1.2}
.tro small{color:var(--muted);font-size:12.5px;line-height:1.25}
.tro.off{opacity:.42}
.tro.off svg{filter:grayscale(1)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item .ic{background:#141826;border-radius:8px;line-height:0}
.item b{font-size:16px}
.item small{color:var(--muted);font-size:13.5px;line-height:1.3;flex:1}
.item .owned{color:var(--good);font-weight:600;font-size:14px}
.item .btn{font-size:15px;padding:8px 12px}
.item .boost{font-size:13px;color:var(--good);font-weight:600}

/* challenge */
.cbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cbar .dots{display:flex;gap:6px;margin-right:auto}
.cbar .dots i{width:26px;height:10px;border-radius:5px;background:var(--panel2)}
.cbar .dots i.on{background:var(--amber)}
.cbar .dots i.ok{background:var(--good)}
.combo{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px}
.combo.hot{border-color:var(--flame);color:var(--flame)}
.chal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.scene{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--panel2);border:2px solid var(--line)}
.av.dovid{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:18px}
.bubble b.who{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.vis{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;place-items:center;min-height:160px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.ask{font-size:24px;font-weight:600;line-height:1.3;margin:0 0 12px}
.field{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;font-size:30px}
.field:focus-within{border-color:var(--amber)}
.field span{color:var(--muted)}
.field input{border:0;background:transparent;width:100%;min-width:0;padding:10px 6px;font-size:30px;outline:none;font-variant-numeric:tabular-nums}
.field.small{font-size:22px;padding:0 10px}
.field.small input{font-size:22px;padding:6px 4px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.keypad button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 0;font-size:22px;font-weight:600}
.keypad button:active{transform:translateY(1px)}
.keypad button.wide{font-size:15px}
.checkrow{display:flex;gap:10px;margin-top:10px}
.checkrow .btn{flex:1}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choices .btn{flex:1;min-width:120px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tools button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px;font-weight:600;line-height:1.15}
.tools button:disabled{opacity:.4;cursor:default}
.tools button.help{border-color:var(--amber);background:var(--amber-soft)}
.tools svg{width:24px;height:24px}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:17px;display:none}
.fb.on{display:block}
.fb.good{background:var(--good-soft)}
.fb.soft{background:var(--amber-soft)}
.fb .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.guide{margin-top:12px;border:2px solid var(--amber);border-radius:14px;padding:14px;background:var(--panel)}
.guide .gh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.guide .gh p{margin:0;font-size:15.5px}
.gs{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.gs .n{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:13px;font-weight:700}
.gs.done .n{background:var(--good);color:var(--panel)}
.gs.cur .n{background:var(--amber);color:var(--amber-ink)}
.gs .q{font-size:17px}
.gs .a{font-weight:700;color:var(--good)}
.gs .row{display:flex;gap:8px;margin-top:6px;align-items:center}
.gs .row .field{flex:1}
.gs .hint{margin-top:6px;font-size:15px;background:var(--amber-soft);border-radius:8px;padding:7px 10px}
.gs.later{opacity:.45}

/* visuals */
.rcpt{background:#fffdf6;color:#2a2a26;font:15px/1.5 "Courier New",monospace;padding:14px 18px;min-width:240px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.rcpt .rl{display:flex;justify-content:space-between;gap:16px}
.rcpt .tot{border-top:1px dashed #999;margin-top:6px;padding-top:6px;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:74px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:2px}
.tile b{font-size:17px}
.tile small{font-size:11.5px;color:var(--muted)}
.tile.half{border-style:dashed}
.splitv{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.pile{display:flex;flex-direction:column;align-items:center;gap:4px}
.pile b{font-size:22px}
.crew{display:flex;flex-wrap:wrap;gap:6px;max-width:300px;justify-content:center}
.person{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.fbar{width:100%;max-width:440px}
.fbar svg{width:100%;height:auto;display:block}
.packs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pack{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);text-align:center;min-width:140px}
.pack small{display:block;color:var(--muted);font-weight:600}
.pack .cbl{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:150px;margin:6px auto}
.pack b{font-size:18px}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
.ledger>div{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.ledger .in{background:var(--good-soft)}
.ledger .out{background:var(--bad-soft)}
.ledger b{font-size:22px}
.ledger span{font-size:13px;color:var(--muted)}
.lens{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.lenrow{display:flex;align-items:center;gap:10px}
.lenrow i{height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--amber) 0 18px,transparent 18px 20px)}
.lenrow b{white-space:nowrap;font-size:18px}
.vlabel{font-weight:700;font-size:18px;margin-bottom:8px;text-align:center}

.rtab{border-collapse:collapse;font-size:20px;min-width:240px}
.rtab th{font-size:14px;color:var(--muted);font-weight:600;padding:4px 18px;border-bottom:2px solid var(--line)}
.rtab td{text-align:center;padding:8px 18px;font-weight:700;border-bottom:1px solid var(--line)}
.rtab tr.q td{color:var(--amber)}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.chain>div{border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;background:var(--panel2)}
.chain>div.pos{background:var(--good-soft)}.chain>div.neg{background:var(--bad-soft)}
.chain span{font-size:13px;color:var(--muted)}.chain b{font-size:20px}.chain i{color:var(--muted);font-style:normal}
.eqv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:20px;font-weight:700}
.eqv span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.eqv span.tot{background:var(--amber-soft);border-color:var(--amber)}.eqv i{font-style:normal;color:var(--muted)}
.raffle{display:grid;grid-template-columns:repeat(10,22px);gap:5px;justify-content:center}
.raffle i{height:14px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.raffle i.win{background:var(--amber);border-color:var(--amber)}
.nights{display:flex;gap:14px;align-items:flex-end;justify-content:center;height:160px}
.nights div{display:flex;flex-direction:column;align-items:center;gap:3px}
.nights i{width:38px;border-radius:6px 6px 0 0;background:var(--amber)}
.nights b{font-size:16px}.nights small{font-size:12px;color:var(--muted)}
.vis svg{max-width:100%}
/* floating rewards & banner */
.float{position:fixed;font-weight:800;font-size:28px;color:var(--good);pointer-events:none;z-index:40;animation:floatup 1.3s ease-out forwards;text-shadow:0 1px 0 var(--panel)}
@keyframes floatup{from{opacity:0;transform:translate(-50%,0) scale(.8)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}to{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:45;pointer-events:none;display:none;text-align:center;background:var(--panel);border:2px solid var(--amber);border-radius:18px;padding:18px 30px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.banner.on{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.banner b{display:block;font-family:"Big Shoulders Display","Barlow",sans-serif;font-size:44px;font-weight:800;color:var(--amber);line-height:1}
.banner span{font-size:18px;font-weight:600}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.flash{animation:flash .6s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--good)}50%{box-shadow:0 0 0 6px var(--good)}100%{box-shadow:0 0 0 0 transparent}}

/* scratch pad */
.pad{position:fixed;right:16px;bottom:16px;width:min(440px,calc(100vw - 32px));height:min(520px,70vh);background:var(--panel);border:2px solid var(--line);border-radius:16px;z-index:30;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pad[hidden]{display:none}
.pad .ph{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.pad .ph b{margin-right:auto}
.pad .ph button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 10px;font-size:14px}
.pad .ph button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.pad .pq{padding:6px 12px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.pad canvas{flex:1;width:100%;touch-action:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;border-radius:0 0 14px 14px;cursor:crosshair}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,10,18,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;max-height:94%;overflow:auto;padding:22px 24px}
.sheet h2{font-size:38px;margin:4px 0 8px}
.sheet p{margin:0 0 10px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sheet label{font-size:14px;color:var(--muted)}
.sheet input[type=text],.sheet textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:17px;margin-top:4px}
.sheet textarea{height:84px;font:12px/1.3 ui-monospace,Menlo,monospace;resize:vertical}
.sheet .stage{margin:-4px 0 14px}
.pdots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.pdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pdots i.on{background:var(--amber)}
.tut{display:flex;gap:16px;align-items:center}
.tut .tic{flex:none;width:96px;height:96px;background:var(--amber-soft);border-radius:20px;display:grid;place-items:center}
.tut .tic svg{width:54px;height:54px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sum div{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:24px}
.sum small{color:var(--muted);font-size:13px}
.pay .l{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.pay .l.tot{border:0;font-size:24px;font-weight:700;padding-top:10px}
.notice{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:15.5px;margin-top:10px}
/* video */

<script>
/* ===== helpers ===== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const r2 = n => Math.round(n*100)/100;
const fmt = n => { n = r2(n); return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const money = n => (n < 0 ? '−$' : '$') + fmt(Math.abs(n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gcd = (a,b) => b ? gcd(b, a % b) : Math.abs(a);
const cap = s => s[0].toUpperCase() + s.slice(1);
function fr(n, d = 1){
  if (d < 0){ n = -n; d = -d; }
  const g = gcd(n, d) || 1; n /= g; d /= g;
  const neg = n < 0; n = Math.abs(n);
  const w = Math.floor(n / d), r = n % d;
  const f = r ? `<span class="fr"><span>${r}</span><span>${d}</span></span>` : '';
  return (neg ? '−' : '') + (w ? (r ? `${w}\u2009${f}` : `${w}`) : (r ? f : '0'));
}
const raw = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function parseNum(rawv){
  let t = String(rawv).replace(/[$,%¢]/g,'').replace(/[−–]/g,'-').replace(/[a-z]/gi,'').trim();
  if (!t) return NaN;
  let neg = false; if (t[0] === '-'){ neg = true; t = t.slice(1).trim(); }
  t = t.replace(/^(\d+)-(\d+\s*\/)/, '$1 $2');
  let m, v;
  if ((m = t.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) v = +m[1] + (+m[2])/(+m[3]);
  else if ((m = t.match(/^(\d+)\s*\/\s*(\d+)$/))) v = (+m[1])/(+m[2]);
  else if (/^(\d+\.?\d*|\.\d+)$/.test(t)) v = +t;
  else return NaN;
  return neg ? -v : v;
}
const todayStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
let S = null;
/* ===== school server (SCHOOL Supabase project, same sign-in as the portal) ===== */
const SUPABASE_URL = "https://belathxxgwayxdmiqvpd.supabase.co";   // SCHOOL project
const SUPABASE_KEY = "sb_publishable_Kxuxi919RbsmEk-p8iNt-w_zm6BsRI9"; // public key, safe to keep here
const IDLE_MINUTES = 20;          // signs out after this long with no activity
const CLOSE_WARN_MINUTES = 5;     // warning before the daily lock closes (lock is set in the Teacher view)
async function rpc(fn, args, keep){
  const h = {'Content-Type':'application/json', 'apikey':SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE_KEY;
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {method:'POST', headers:h, body:JSON.stringify(args || {}), keepalive:!!keep});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
let TOKEN = null, NAME = '', DEMO = /[?&]demo\b/.test(location.search), dirty = false, pendingEv = [], saveT = null, saveChain = Promise.resolve(), lastAct = Date.now();
const TIER_WORD = how => how === 'solo1' ? 'on his own, first try' : how === 'solo2' ? 'on his own, second try' : 'with Dovid’s help';
function report(kind, d){
  const ev = {
    solve: () => ['solve', `${SK(d.skill).name}, level ${d.tier}: ${TIER_WORD(d.how)}`],
    shift: () => ['shift', `Finished a shift (${d.event}): ${d.solo} on his own, ${d.team} with Dovid, best combo ${d.best}, earned $${Math.round(d.earned)}`],
    buy: () => ['gear', `Bought ${d.item} for $${d.price}`],
    khan: () => ['khan', `Opened Khan Academy video "${d.video}" (${SK(d.skill).name})`],
    lesson: () => ['lesson', `Watched Dovid’s lesson: ${SK(d.skill).name}`],
    unlock: () => ['unlock', `Showed he understands ${SK(d.after).name}. Unlocked ${SK(d.skill).name}`],
    start: () => ['company', d.again ? `Started over with a new company, "${d.name}"` : `Named his company "${d.name}"`]
  }[kind];
  if (ev){ const [e, t] = ev(); pendingEv.push({e, d:t}); }
}
function setSaving(t, bad){ const el = $('#saving'); if (!el) return; el.textContent = t; el.className = 'saving' + (bad ? ' bad' : ''); }
function save(){ dirty = true; if (DEMO || !TOKEN || !S) return; clearTimeout(saveT); saveT = setTimeout(flush, 700); }
function flush(keep){
  clearTimeout(saveT);
  if (DEMO || !TOKEN || !S) return Promise.resolve();
  dirty = false; const ev = pendingEv.splice(0, 50), body = {p_token:TOKEN, p_state:S, p_events:ev};
  setSaving('Saving…');
  saveChain = saveChain.then(() => rpc('stage_save', body, keep)).then(r => {
    if (r && r.ok) setSaving(pendingEv.length || dirty ? 'Saving…' : 'Saved');
    else {
      pendingEv.unshift(...ev); dirty = true;
      if (r && r.error === 'session'){ setSaving('Signed out', true); toast('Your session ended. Please sign in again.'); setTimeout(() => signOut(true), 1500); }
      else setSaving('Not saved yet', true);
    }
  }).catch(() => { pendingEv.unshift(...ev); dirty = true; setSaving('Not saved yet, retrying', true); });

  return [D(`Split $${rate} into $${t} and $${o}. First: ${h} × $${t}`, h*t, {pre:'$', hint:`${h} × ${t/10} = ${h*t/10}, then add a zero.`}), D(`Next: ${h} × $${o}`, h*o, {pre:'$'}), D(`Add them: $${h*t} + $${h*o}`, h*rate, {pre:'$'})];

  if (q <= 10) return [D(`What number times ${n} makes ${T}?  ${n} × ? = ${T}`, q, {pre:'$', hint:`Count by ${n}s: ${timesRow(n)}.`})];
  if (q % 10 === 0) return [D(`$${T} is ${T/10} tens. Share ${T/10} tens between ${n}: ${T/10} ÷ ${n}`, q/10, {post:'tens', hint:`${n} × ? = ${T/10}`}), D(`So each person gets ${q/10} tens. That’s`, q, {pre:'$'})];

/* ===== long division: steps and the animated "house" ===== */
function ldStages(N, d){
  const g = String(N).split('').map(Number), st = [];
  let i = 0, cur = g[0];
  while (cur < d && i < g.length - 1){ i++; cur = cur*10 + g[i]; }
  for (;;){
    const q = Math.floor(cur/d), prod = q*d, rem = cur - prod;
    st.push({pos:i, cur, q, prod, rem, next: i < g.length-1 ? g[i+1] : null});
    if (i >= g.length - 1) break;
    i++; cur = rem*10 + g[i];
  }
  return st;
}
// k = how many guide steps are done (2 per stage: the digit on top, then the subtraction)
function visLong(N, d, k = 0, opts = {}){
  const g = String(N).split(''), n = g.length, st = ldStages(N, d), done = k >= st.length*2;
  const cell = (t, cls = '') => `<span class="${cls}">${t}</span>`;
  const rows = [];
  // quotient row
  const qrow = Array(n).fill('');
  st.forEach((x, j) => { if (k >= 2*j+1) qrow[x.pos] = cell(x.q, k === 2*j+1 ? 'pop new' : 'q'); });
  rows.push(`<div class="ldr">${cell('')}${qrow.map(c => c || cell('')).join('')}</div>`);
  rows.push(`<div class="ldr"><span class="ldd">${d}</span>${g.map((c, j) => cell(c, 'dv' + (j === 0 ? ' first' : '') + (opts.dot === j ? ' dot' : ''))).join('')}</div>`);
  st.forEach((x, j) => {
    if (k < 2*j+1) return;
    const ps = String(x.prod), start = x.pos - ps.length + 1, row = Array(n).fill(cell(''));
    ps.split('').forEach((c, m) => row[start+m] = cell(c, 'ul' + (k === 2*j+1 ? ' pop' : '')));
    if (start - 1 >= 0) row[start-1] = cell('−', 'mi'); 
    rows.push(`<div class="ldr">${cell(start - 1 < 0 ? '−' : '', 'mi')}${row.join('')}</div>`);
    if (k < 2*j+2) return;
    const rs = String(x.rem), rrow = Array(n).fill(cell(''));
    rs.split('').forEach((c, m) => rrow[x.pos - rs.length + 1 + m] = cell(c, k === 2*j+2 ? 'pop' : ''));
    if (x.next !== null && j < st.length-1) rrow[x.pos+1] = cell(x.next, 'bd' + (k === 2*j+2 ? ' pop' : ''));
    rows.push(`<div class="ldr">${cell('')}${rrow.join('')}</div>`);

    init,
    // coins fly from one element to another along a curve; onArrive fires once, when the last lands
    coins(fromEl, toEl, n, onArrive){
      if (reduceMotion() || !fromEl || !toEl || !ctx){ onArrive && onArrive(); return; }
      const a = center(fromEl), b = center(toEl); let left = n;
      for (let i=0;i<n;i++){
        const sx = a.x + (Math.random()-.5)*120, sy = a.y + (Math.random()-.5)*50;
        const cx = (sx + b.x)/2 + (Math.random()-.5)*260, cy = Math.min(sy, b.y) - 120 - Math.random()*140;
        const delay = i*55, dur = 700 + Math.random()*250, t0 = performance.now() + delay, s = 8 + Math.random()*4, sp = Math.random()*6;
        add({step(c){
          const t = (performance.now() - t0)/dur; if (t < 0) return true;
          const k = Math.min(1, t), e = k*k*(3-2*k), u = 1-e;
          const x = u*u*sx + 2*u*e*cx + e*e*b.x, y = u*u*sy + 2*u*e*cy + e*e*b.y;
          coin(c, x, y, s*(1 - .35*e), sp + k*14);
          if (k >= 1){ if (--left === 0 && onArrive) onArrive(); return false; }
          return true;
        }});
      }
    },
    // glowing burst of sparks around a point or element
    burst(at, n = 26, cols = COLS){
      if (reduceMotion() || !ctx) return;
      const p0 = at.nodeType ? center(at) : at;
      for (let i=0;i<n;i++){
        const ang = Math.random()*Math.PI*2, v = 2 + Math.random()*5, col = cols[i % cols.length];
        let x = p0.x, y = p0.y, vx = Math.cos(ang)*v, vy = Math.sin(ang)*v, life = 1;
        add({step(c){
          x += vx; y += vy; vx *= .94; vy = vy*.94 + .08; life -= .022;
          if (life <= 0) return false;
          c.globalCompositeOperation = 'lighter'; c.globalAlpha = life;
          c.fillStyle = col; c.beginPath(); c.arc(x, y, 2.6*life + .8, 0, Math.PI*2); c.fill();
          c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; return true;
        }});
      }
    },
    // confetti from the top of the screen
    confetti(n = 90){
      if (reduceMotion() || !ctx) return;
      for (let i=0;i<n;i++){
        let x = Math.random()*innerWidth, y = -20 - Math.random()*innerHeight*.5, vx = (Math.random()-.5)*2.4, vy = 2 + Math.random()*3;
        let r = Math.random()*6, vr = (Math.random()-.5)*.3, w = 6 + Math.random()*6, h = 3 + Math.random()*5, col = COLS[i % COLS.length], sw = Math.random()*6;
        add({step(c){
          x += vx + Math.sin((y + sw*40)/40)*.8; y += vy; r += vr;
          if (y > innerHeight + 20) return false;
          c.save(); c.translate(x, y); c.rotate(r); c.scale(1, Math.cos(r*2)); c.fillStyle = col; c.fillRect(-w/2,-h/2,w,h); c.restore(); return true;
        }});
      }
    },
    // stage lights sweeping across the whole screen
    lights(ms = 1900){
      if (reduceMotion() || !ctx) return;
      const t0 = performance.now(), cols = ['240,180,76','108,199,217','255,138,76','134,211,148'];
      add({step(c){
        const t = (performance.now() - t0)/ms; if (t >= 1) return false;
        const fade = Math.sin(Math.PI*t), W = innerWidth, H = innerHeight;
        c.globalCompositeOperation = 'lighter';
        cols.forEach((col, i) => {
          const ox = W*(i+.5)/cols.length, ang = Math.sin(t*Math.PI*2 + i*1.7)*.55, len = H*1.3;
          const tx = ox + Math.sin(ang)*len, ty = Math.cos(ang)*len, spread = 140;
          const g = c.createLinearGradient(ox, 0, tx, ty); g.addColorStop(0, `rgba(${col},${.26*fade})`); g.addColorStop(1, `rgba(${col},0)`);
          c.fillStyle = g; c.beginPath(); c.moveTo(ox-6, -4); c.lineTo(ox+6, -4);
          c.lineTo(tx + Math.cos(ang)*spread, ty - Math.sin(ang)*spread); c.lineTo(tx - Math.cos(ang)*spread, ty + Math.sin(ang)*spread); c.closePath(); c.fill();
        });
        c.globalCompositeOperation = 'source-over'; return true;
      }});
    }
  };
})();

function playDay(){
  const t = todayStr(), d = S.days;
  if (d.last === t) return;
  let next = 1;
  if (d.last){
    const a = new Date(d.last + 'T12:00'), b = new Date(t + 'T12:00'), gap = Math.round((b - a)/864e5);
    const skipsShabbos = gap === 2 && new Date(a.getTime() + 864e5).getDay() === 6;
    if (gap === 1 || skipsShabbos) next = d.streak + 1;
  }
  d.last = t; d.streak = next;
  if (next >= 2){ const bonus = Math.min(100, next*10); addCash(bonus); setTimeout(() => { banner(`${next} days in a row`, `Day bonus: +$${bonus}`); FX.burst($('#banner'), 40); }, 400); }

function mission(ev, val = 1){

    const def = MISSION_POOL.find(x => x.id === m.id); if (m.done || def.ev !== ev) return;

/* ===== read aloud ===== */
function speakEls(els, done){
  if (!('speechSynthesis' in window)){ toast('Reading aloud isn’t available on this computer.'); return; }
  stopSpeak();
  const text = els.filter(Boolean).map(el => { const c = el.cloneNode(true); c.querySelectorAll('.fr').forEach(f => f.replaceWith(` ${f.children[0].textContent} over ${f.children[1].textContent} `)); return c.textContent.replace(/−/g,' minus ').replace(/×/g,' times ').replace(/÷/g,' divided by '); }).join('. ');
  const u = new SpeechSynthesisUtterance(text); u.rate = .95; if (done) u.onend = done;
  speechSynthesis.speak(u);
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ===== scratch pad ===== */
const pad = {erase:false, drawing:false, last:null, ctx:null};
function openPad(){
  const p = $('#pad'); p.hidden = false; sizePad(); mission('pad');
}
function closePad(){ $('#pad').hidden = true; }
function clearPad(){ const c = $('#padC'); if (pad.ctx) pad.ctx.clearRect(0,0,c.width,c.height); }
function sizePad(){
  const c = $('#padC'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width === Math.round(r.width*dpr) && c.height === Math.round(r.height*dpr)) return;
  const old = pad.ctx ? c.toDataURL() : null;
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  pad.ctx = c.getContext('2d'); pad.ctx.scale(dpr,dpr); pad.ctx.lineCap = 'round'; pad.ctx.lineJoin = 'round';
  if (old){ const im = new Image(); im.onload = () => pad.ctx.drawImage(im,0,0,r.width,r.height); im.src = old; }
}
(function initPad(){
  const c = $('#padC');
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => { sizePad(); pad.drawing = true; pad.last = pos(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => {
    if (!pad.drawing) return; const p = pos(e), x = pad.ctx;
    x.globalCompositeOperation = pad.erase ? 'destination-out' : 'source-over';
    x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text'); x.lineWidth = pad.erase ? 22 : 3;
    x.beginPath(); x.moveTo(...pad.last); x.lineTo(...p); x.stroke(); pad.last = p;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => c.addEventListener(ev, () => pad.drawing = false));
  $('#pPen').onclick = () => { pad.erase = false; $('#pPen').setAttribute('aria-pressed','true'); $('#pErase').setAttribute('aria-pressed','false'); };
  $('#pErase').onclick = () => { pad.erase = true; $('#pErase').setAttribute('aria-pressed','true'); $('#pPen').setAttribute('aria-pressed','false'); };
  $('#pClear').onclick = clearPad;
  $('#pClose').onclick = closePad;
})();

/* ===== modals and menus ===== */
function showModal(html){ $('#sheet').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); vStop(); $('#sheet').innerHTML = ''; }
function welcome(){
  showModal(`<div class="stage">${stageSVG({gear:{}, crowd:0, mode:'idle'})}</div>
    <h2 class="disp">Encore</h2>
    <p>Start with one microphone. Run sound for simchas, solve the jobs, earn money and buy gear, until the crowd at your own concert tour is calling for an encore.</p>
    <label for="nm">Name your company</label>
    <input type="text" id="nm" maxlength="30" placeholder="For example: Clear Sound Productions">
    <div class="acts"><button class="btn big" id="bW">Start</button></div>`);
  const go = () => { const again = !!S, nm = $('#nm').value.trim() || 'Clear Sound Productions'; const keepAct = S && S.act; const prevR = (S && S.restarts) || 0; S = newState(nm); if (keepAct) S.act = keepAct; S.restarts = prevR + (again ? 1 : 0); report('start', {name:nm, again}); flush(); closeModal(); renderHub(); };
  $('#bW').onclick = go; $('#nm').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#nm').focus();
}
function helpScreen(){
  showModal(`<h2 class="disp">How to play</h2>
    <p><b>Shifts.</b> A shift is one night of work. Pick your pace: <b>Quick</b> for 8 fast challenges, <b>Steady</b> for 5 at your own speed, or <b>With Dovid</b> for 4 done step by step together.</p>
    <p><b>Stuck?</b> Tap <b>Help me, Dovid</b>. He breaks the problem into little steps. You still get paid, and your combo keeps going.</p>
    <p><b>Watch how</b> plays a short video for that skill. <b>Scratch pad</b> gives you paper to work on. <b>Read it</b> reads the challenge out loud.</p>
    <p><b>Combo.</b> Every challenge you solve adds to your combo. At 3 you earn 1½ times as much, at 5 double, and at 10 triple, plus streak bonuses.</p>
    <p><b>New skills.</b> You start with division. When you reach 3 stars and solve 6 of your last 8 on your own, the next skill unlocks: fractions, then decimals, then the bigger jobs.</p>
    <p><b>Growing.</b> Earn points to level up your company. Each skill earns up to 4 stars. Buy gear to make every job pay more, and finish your daily missions for the daily chest.</p>
    <p><b>Saving.</b> Your company saves to the school server automatically. Sign in on any Chromebook and you’ll pick up right where you left off.</p>
    <div class="acts"><button class="btn line" id="bNew">Start a new company</button><button class="btn" id="bX">Back to the game</button></div>`);
  $('#bX').onclick = closeModal;
  $('#bNew').onclick = () => { showModal(`<h2 class="disp">Start over?</h2><p>This erases ${esc(S.company)} on this computer. Copy your save code first if you might want it back.</p><div class="acts"><button class="btn line" id="bK">Keep playing</button><button class="btn" id="bWipe">Start a new company</button></div>`); $('#bK').onclick = closeModal; $('#bWipe').onclick = welcome; };
}
function saveScreen(){
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  showModal(`<h2 class="disp">Save code</h2><p>Copy this code and keep it somewhere safe. Paste it here on any computer to pick up where you left off.</p>
    <textarea id="code" readonly>${code}</textarea>
    <p style="margin:10px 0 4px">Have a code? Paste it here.</p>
    <textarea id="codeIn" placeholder="Paste a save code"></textarea>
    <div class="acts"><button class="btn line" id="bCopy">Copy my code</button><button class="btn line" id="bLoad">Load pasted code</button><button class="btn" id="bX">Done</button></div>`);
  $('#bX').onclick = closeModal;
  $('#bCopy').onclick = () => { const t = $('#code'); t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); } $('#bCopy').textContent = 'Copied'; };
  $('#bLoad').onclick = () => {
    try{ const s = JSON.parse(decodeURIComponent(escape(atob($('#codeIn').value.trim())))); if (!s || s.v !== 3 || !s.skills) throw 0;
      S = s; save(); closeModal(); renderHub(); toast('Game loaded.'); }
    catch(e){ $('#bLoad').textContent = 'That code didn’t work. Check it and try again.'; }
  };
}

/* ===== wiring ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.buy) return buy(b.dataset.buy);
  if (b.dataset.pace){ S.pace = b.dataset.pace; save(); $$('[data-pace]').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (b.dataset.practice){ if (S.shift){ toast('Finish your shift first. It’s waiting for you.'); return; } return startShift(b.dataset.practice); }
  if (b.dataset.lesson) return playLesson(b.dataset.lesson, () => renderHub());
});
$('#bHelp').onclick = () => S && helpScreen();
$('#bOut').onclick = () => signOut();
$('#inGo').onclick = signIn;
$('#inPin').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
$('#inName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#inPin').focus(); });
$('#teachLink').onclick = () => { const p = prompt('Teacher password (same as the school portal):'); if (p){ TPASS = p; loadTeacher(); } };
window.addEventListener('resize', () => { if (!$('#pad').hidden) sizePad(); });


/* ===== teacher view ===== */
let TPASS = '';
const fmtWhen = t => t ? new Date(t).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
function weekDates(){ const d = new Date(); d.setDate(d.getDate() - d.getDay()); return [...Array(7)].map((_,i) => { const x = new Date(d); x.setDate(d.getDate()+i); return todayStr(x); }); }
function studentRow(s){
  const st = s.state || {};
  if (!st.skills) return `<tr><td><b>${esc(s.name)}</b></td><td colspan="6" class="small">Signed in but hasn’t started a company yet.</td><td>${fmtWhen(s.last_seen || s.updated_at)}</td><td><button class="link" data-reset="${esc(s.id)}" data-name="${esc(s.name)}">Reset</button></td></tr>`;
  const open = id => ORDER.indexOf(id) === 0 || !!(st.open && st.open[id]);
  const und = id => { const k = st.skills[id] || {m:0}; return k.m >= 300 && (k.rec || []).length >= 8 && (k.rec || []).slice(-8).filter(Boolean).length >= 6; };
  const curId = [...ORDER].filter(open).pop(), ck = st.skills[curId] || {m:0, rec:[]};
  const stars = id => Math.min(4, Math.floor(((st.skills[id] || {}).m || 0)/100) + 1);
  const recent = (ck.rec || []).slice(-8), solo = recent.filter(Boolean).length;
  const td = todayStr(), wd = weekDates(), A = (st.act || {})[td] || {m:0, n:0, t:0};
  const W = wd.reduce((x, d) => { const a = (st.act || {})[d]; if (a){ x.m += a.m; x.n += a.n; x.t += a.t; } return x; }, {m:0, n:0, t:0});
  const chips = SKILLS.map(sk => `<span class="chip ${sk.id === curId ? 'cur' : und(sk.id) ? 'ok' : open(sk.id) ? '' : 'lock'}" title="${esc(sk.math)}">${esc(sk.name)}${open(sk.id) ? ` ${'★'.repeat(stars(sk.id))}` : ''}${und(sk.id) ? ' ✓' : ''}</span>`).join('');
  return `<tr>
    <td><b>${esc(s.name)}</b><div class="small">${esc(st.company || '')}, level ${st.level || 1}</div></td>
    <td><b>${esc(SK(curId).name)}</b><div class="small">${esc(SK(curId).math)}</div><div class="small">${stars(curId)} of 4 stars</div></td>
    <td class="n">${recent.length ? `${solo} of ${recent.length}` : '—'}<div class="small">on his own</div></td>
    <td><div class="chips">${chips}</div></td>
    <td class="n">${A.n} solved${A.t ? `<div class="small">${A.t} with Dovid</div>` : ''}<div class="small">${Math.round(A.m/60)} min</div></td>
    <td class="n">${W.n} solved${W.t ? `<div class="small">${W.t} with Dovid</div>` : ''}<div class="small">${Math.round(W.m/60)} min</div></td>
    <td class="n">${(st.stats || {}).solved || 0}<div class="small">all time</div></td>
    <td>${fmtWhen(s.last_seen || s.updated_at)}</td>
    <td><button class="link" data-reset="${esc(s.id)}" data-name="${esc(s.name)}">Reset</button></td></tr>`;
}
async function loadTeacher(){
  let res;
  try{ res = await rpc('stage_admin_data', {p_pass:TPASS}); }catch(e){ alert('Can’t reach the school server. Check the Wi-Fi and try again.'); return; }
  if (!res.ok){ alert('That password isn’t right.'); TPASS = ''; return; }
  await fetchLock();
  document.body.dataset.mode = 'teacher';
  $('#tview').innerHTML = `<div class="twrap">
    <div class="thead"><h2 class="disp">Encore: teacher view</h2><button class="ghost" id="tRefresh">Refresh</button><button class="ghost" id="tClose">Close</button></div>
    <div class="tbar"><label><input type="checkbox" id="lkOn" ${LOCK.on ? 'checked' : ''}> <b id="lkState">${LOCK.on ? 'Daily lock on' : 'Daily lock off'}</b></label>
      <label>Closes <input type="time" id="lkClose" value="${LOCK.close}"></label><label>Reopens <input type="time" id="lkOpen" value="${LOCK.open}"></label>
      <button class="btn" id="lkSave" style="padding:6px 14px;font-size:15px">Save</button><span class="small" id="lkNow">${isClosed() ? 'Closed right now' : 'Open right now'}</span></div>
    <div class="tgrid">
      <div class="tcard"><table class="tbl"><tr><th>Student</th><th>Now learning</th><th class="n">Last 8</th><th>Skills (★ stars, ✓ understood)</th><th class="n">Today</th><th class="n">This week</th><th class="n">Solved</th><th>Last active</th><th></th></tr>
        ${res.students.map(studentRow).join('') || '<tr><td colspan="9">No one has signed in yet. Students show up here after their first sign-in.</td></tr>'}</table>
        <p class="small" style="margin:10px 0 0">A skill unlocks the next one when he reaches 3 stars and solves 6 of his last 8 on his own. “Last 8” is for the skill he’s learning now. Problems solved with Dovid’s help count toward stars but not toward the 6 of 8.</p></div>
      <div class="tcard"><b>Activity log</b>
        <table class="tbl tlog" style="margin-top:6px"><tr><th>When</th><th>Student</th><th>What happened</th></tr>
        ${res.log.map(l => `<tr><td style="white-space:nowrap">${fmtWhen(l.at)}</td><td>${esc(l.name || '')}</td><td>${esc(l.detail || l.event)}</td></tr>`).join('') || '<tr><td colspan="3" class="small">Nothing yet.</td></tr>'}</table></div>
    </div></div>`;
  $('#lkOn').onchange = () => { $('#lkState').textContent = $('#lkOn').checked ? 'Daily lock on' : 'Daily lock off'; };
  $('#lkSave').onclick = async () => {
    const r = await rpc('stage_admin_set_settings', {p_pass:TPASS, p_lock_on:$('#lkOn').checked, p_close:$('#lkClose').value, p_open:$('#lkOpen').value});
    if (r.ok){ await fetchLock(); $('#lkNow').textContent = isClosed() ? 'Closed right now' : 'Open right now'; toast(LOCK.on ? `Saved. Closes at ${fmtT12(LOCK.close)}, reopens at ${fmtT12(LOCK.open)}.` : 'Saved. The daily lock is off.'); }
    else toast(r.error === 'time' ? 'Check the times and try again.' : 'Couldn’t save. Check the password.');
  };
  $('#tRefresh').onclick = loadTeacher;
  $('#tClose').onclick = () => { TPASS = ''; showGate(); };
  $$('[data-reset]').forEach(b => b.onclick = async () => {
    if (!confirm(`Erase ${b.dataset.name}’s Encore company and progress? He’ll start over from the beginning.`)) return;
    const r = await rpc('stage_admin_reset', {p_pass:TPASS, p_student:b.dataset.reset}); toast(r.ok ? 'Progress erased.' : 'Couldn’t reset.'); loadTeacher();
  });
}

function startGame(state){
  document.body.dataset.mode = 'app'; shownCash = null;
  S = state && state.v === 3 && state.skills ? state : null;
  if (S){
    if (!S.math7){ const sk = {}; SKILLS.forEach(x => sk[x.id] = {m:0, ease:0}); S.skills = sk; S.seen.lessons = {}; S.shift = null; S.math7 = true; }
    if (!S.found){ ['div','frb','dec'].forEach(id => { if (!S.skills[id]) S.skills[id] = {m:0, ease:0}; delete S.seen.lessons[id]; }); S.open = {div:true}; S.shift = null; S.found = true; }
    SKILLS.forEach(x => { if (!S.skills[x.id]) S.skills[x.id] = {m:0, ease:0}; });
    S.act = S.act || {};
    header(); renderHub(); save();
  } else { $('#view').innerHTML = `<div class="stage">${stageSVG({gear:{}, crowd:0, mode:'idle'})}</div>`; welcome(); }
}
FX.init();
(async () => {
  await Promise.race([fetchLock(), new Promise(r => setTimeout(r, 3000))]);
  if (DEMO){ NAME = 'Demo'; startGame(null); toast('Demo mode: nothing is saved.'); return; }
  showGate();
})();

</script>
