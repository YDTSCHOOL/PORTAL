<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compound: a finance course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="out">
<div class="shell">
  <aside id="side">
    <div class="brand"><svg viewBox="0 0 100 100" class="seal" aria-hidden="true"></svg>Compound</div>
    <nav class="nav" id="nav">
      <button data-go="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button data-go="course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Course</button>
      <button data-go="messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>Messages<span class="nbadge" id="msgBadge" hidden>0</span></button>
      <button data-go="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 4.5l3.8 1 -3.9 15 -3.8-1z"/></svg>Library</button>
      <button data-go="trophies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/></svg>Achievements</button>
    </nav>
    <div class="side-foot">
      <div class="nm" id="sName"></div>
      <div class="rk" id="sRank"></div>
      <div class="sg" id="sGrade"></div>
      <div class="side-bar"><i id="sBar"></i></div>
      <button id="outBtn">Sign out</button>
    </div>
  </aside>

  <div id="mainCol">
    <header class="top">
      <span class="mini-brand"><svg viewBox="0 0 100 100" class="seal" aria-hidden="true"></svg>Compound</span>
      <h1 id="pageTitle"></h1>
      <span class="spacer"></span>
      <span class="clockwarn" id="clockWarn" hidden></span>
      <span class="saving" id="saving" aria-live="polite"></span>
      <button class="btn ghost small" id="helpBtn">Help</button>
      <span class="pill" id="topPill" hidden></span>
      <button class="btn ghost small" id="exitBtn" hidden>Exit to dashboard</button>
    </header>
    <main>
      <section class="screen" id="signin">
        <div class="seal-art"><svg viewBox="0 0 100 100" id="bigSeal" aria-hidden="true"></svg><h2>Compound</h2><p>A course in money, markets and business</p></div>
        <div class="card" style="padding:26px">
          <div id="signForm">
          <h3 style="font-size:26px;margin:0 0 4px">Sign in</h3>
          <p class="muted" style="margin:0">Use the same name and PIN as the school portal.</p>
          <label class="field"><span>First name</span><input id="inName" autocomplete="off"></label>
          <label class="field"><span>PIN</span><input id="inPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
          <p class="err" id="inErr"></p>
          </div>
          <div id="closedBox" hidden><p class="closed-big" style="margin-top:0">Class is over for today.</p><p class="muted" style="margin:0" id="closedMsg"></p></div>
          <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
            <button class="btn" id="inGo">Sign in</button><span style="flex:1"></span><button class="link" id="teachLink">Teacher</button>
          </div>
        </div>
      </section>
      <section class="screen" id="dash"></section>
      <section class="screen" id="course"></section>
      <section class="screen" id="library"></section>
      <section class="screen" id="trophies"></section>
      <section class="screen" id="lesson">
        <div class="ltop"><span class="ttl" id="lTitle"></span><span class="ph" id="lPhase"></span><div class="track" id="lTrack"></div><span class="lscore" id="lScore" hidden></span><span class="combo" id="lCombo"></span><span class="timer" id="lTimer" hidden></span></div>
        <div class="lbody" id="lBody"><div class="col lesson-text" id="lLeft"></div><div class="col" id="lRight"></div></div>
        <div class="lnav" id="lNav"></div>
      </section>
      <section class="screen" id="result"><div class="result" id="resBox"></div></section>
      <section class="screen" id="teacher"></section>
      <section class="screen" id="messages"></section>
      <section class="screen" id="reply"></section>
    </main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="help" aria-label="Help"><div class="dh"><h3>Help</h3><button class="btn ghost small" id="helpX">Close</button></div><div class="db" id="helpBody"></div></aside>
<div class="toast" id="toast"></div>
<script src="core.js"></script>
<script src="content-1.js"></script>
<script src="content-2.js"></script>
<script src="content-3.js"></script>
<script src="content-4.js"></script>
<script src="content-5.js"></script>
<script src="content-6.js"></script>
<script src="cases-1.js"></script>
<script src="cases-2.js"></script>
<script src="cases-3.js"></script>
<script src="cases-4.js"></script>
<script src="cases-5.js"></script>
<script src="videos.js"></script>
<script src="app.js"></script>
<script src="walk.js"></script>
<script src="orientation.js"></script>
<script src="coach.js"></script>
<script src="messages.js"></script>
</body>
</html>
